name: Build Kernel (Xperia XZ1 SOV36 poplar_kddi + KernelSU-Next)

# Verified against royd-jpg/android_kernel_sony_msm8998 @ lineage-22.2 (7b9b13b, identical to justinlin099 upstream) (Linux 4.4.302):
#   defconfig : arch/arm64/configs/lineage-msm8998-yoshino-poplar_kddi_defconfig
#   MACH flag : CONFIG_MACH_SONY_POPLAR_KDDI=y  (maple/lilac/poplar/poplar_dsds are all "is not set")
#   DTS/DTB   : arch/arm/boot/dts/qcom/msm8998-v2.1-yoshino-poplar_kddi.dts -> .dtb
#               (arch/arm64/boot/dts/qcom is a symlink to arch/arm/boot/dts/qcom)
#   Image fmt : CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y -> Image.gz-dtb
#   KernelSU  : KernelSU-Next submodule + drivers/kernelsu symlink + manual hooks already in tree
# Not verified: that the toolchain below builds this tree cleanly (this workflow was not executed).

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Kernel branch to build"
        required: true
        default: "lineage-22.2"
        type: string
      repo:
        description: "Kernel repository (owner/name)"
        required: true
        default: "royd-jpg/android_kernel_sony_msm8998"
        type: string
      toolchain:
        description: "Compiler"
        required: true
        default: "clang"
        type: choice
        options:
          - clang
          - gcc
      clang_version:
        description: "clang/lld/llvm major version from Ubuntu 22.04 apt (only for toolchain=clang)"
        required: true
        default: "14"
        type: string
      ksu_manual_hook:
        description: "Force CONFIG_KSU_MANUAL_HOOK=y (tree already contains manual ksu_* hooks). false = kprobes hook mode"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      KDIR: ${{ github.workspace }}/kernel
      ART: ${{ github.workspace }}/artifacts
      BRANCH: ${{ inputs.branch }}
      TOOLCHAIN: ${{ inputs.toolchain }}
      CLANG_VERSION: ${{ inputs.clang_version }}
      KSU_MANUAL_HOOK: ${{ inputs.ksu_manual_hook }}
    steps:
      - name: Checkout kernel (${{ inputs.branch }})
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.branch }}
          fetch-depth: 1
          submodules: false
          path: kernel

      - name: Validate poplar_kddi defconfig and DTB exist
        shell: bash
        run: |
          set -euo pipefail
          cd "$KDIR"
          mkdir -p "$ART"

          mapfile -t DEFS < <(find arch/arm64/configs -maxdepth 1 -type f -name '*poplar_kddi*defconfig' | sort)
          if [ "${#DEFS[@]}" -ne 1 ]; then
            echo "::error title=No unique poplar_kddi defconfig::Expected exactly 1 '*poplar_kddi*defconfig' in arch/arm64/configs on branch '$BRANCH', found ${#DEFS[@]}: ${DEFS[*]:-none}"
            exit 1
          fi
          DEFCONFIG_PATH="${DEFS[0]}"
          DEFCONFIG="$(basename "$DEFCONFIG_PATH")"

          if ! grep -q '^CONFIG_MACH_SONY_POPLAR_KDDI=y' "$DEFCONFIG_PATH"; then
            echo "::error title=Wrong defconfig::$DEFCONFIG does not set CONFIG_MACH_SONY_POPLAR_KDDI=y"
            exit 1
          fi
          if grep -qE '^CONFIG_MACH_SONY_(MAPLE|MAPLE_DSDS|POPLAR|POPLAR_DSDS|LILAC)=y' "$DEFCONFIG_PATH"; then
            echo "::error title=Wrong defconfig::$DEFCONFIG also enables another Sony machine (maple/lilac/poplar)"
            exit 1
          fi

          mapfile -t DTS < <(find -L arch/arm64/boot/dts arch/arm/boot/dts -type f -name '*poplar_kddi*.dts' -printf '%f\n' 2>/dev/null | sort -u)
          if [ "${#DTS[@]}" -eq 0 ]; then
            echo "::error title=No poplar_kddi DTS::No '*poplar_kddi*.dts' found under arch/arm64/boot/dts or arch/arm/boot/dts on branch '$BRANCH'"
            exit 1
          fi
          DTBS=()
          for d in "${DTS[@]}"; do DTBS+=("${d%.dts}.dtb"); done

          if ! grep -qs 'CONFIG_MACH_SONY_POPLAR_KDDI' arch/arm/boot/dts/qcom/Makefile arch/arm64/boot/dts/qcom/Makefile; then
            echo "::error title=DTB not wired::dts Makefile has no dtb-\$(CONFIG_MACH_SONY_POPLAR_KDDI) rule"
            exit 1
          fi

          echo "defconfig: $DEFCONFIG_PATH"
          echo "dts      : ${DTS[*]}"
          echo "dtb      : ${DTBS[*]}"
          {
            echo "DEFCONFIG=$DEFCONFIG"
            echo "DEFCONFIG_PATH=$DEFCONFIG_PATH"
            echo "DTBS=${DTBS[*]}"
          } >> "$GITHUB_ENV"

      - name: Ensure KernelSU-Next is present (integrate only if missing)
        shell: bash
        run: |
          set -euo pipefail
          cd "$KDIR"

          # .gitmodules uses git@github.com:... (SSH) -> unusable on a runner; rewrite to HTTPS.
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          if [ -f .gitmodules ] && grep -q 'KernelSU-Next' .gitmodules; then
            git submodule sync --recursive
            git submodule update --init --recursive KernelSU-Next
          fi

          ksu_present() {
            [ -f drivers/kernelsu/Kconfig ] \
              && grep -q 'CONFIG_KSU' drivers/Makefile \
              && grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig
          }

          if ksu_present; then
            echo "KernelSU-Next already integrated; skipping setup.sh"
          else
            echo "::warning title=KernelSU missing::Running KernelSU-Next setup.sh (legacy)"
            curl -fLSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
            if ! ksu_present; then
              echo "::error title=KernelSU integration failed::drivers/kernelsu, drivers/Makefile or drivers/Kconfig still not wired after setup.sh"
              exit 1
            fi
          fi
          git -C KernelSU-Next log -1 --format='KernelSU-Next %h %s' 2>/dev/null || true

          if [ "$KSU_MANUAL_HOOK" = "true" ]; then
            for f in fs/exec.c fs/open.c fs/stat.c security/selinux/hooks.c; do
              if ! grep -q 'ksu_' "$f"; then
                echo "::error title=KSU hooks missing::manual hook mode requested but $f contains no ksu_ hook"
                exit 1
              fi
            done
          fi

      - name: Install toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          # arm-linux-gnueabi is required: defconfig has CONFIG_COMPAT_VDSO=y and the arm64 Makefile
          # errors out if CROSS_COMPILE_ARM32 is empty.
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev zlib1g-dev make gcc g++ perl python3 cpio kmod \
            xz-utils lz4 git curl ca-certificates \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi
          if [ "$TOOLCHAIN" = "clang" ]; then
            sudo apt-get install -y --no-install-recommends \
              "clang-$CLANG_VERSION" "lld-$CLANG_VERSION" "llvm-$CLANG_VERSION"
            echo "/usr/lib/llvm-$CLANG_VERSION/bin" >> "$GITHUB_PATH"
          fi

      - name: Configure (defconfig + CONFIG_KSU)
        shell: bash
        run: |
          set -euo pipefail
          cd "$KDIR"

          # Top Makefile selects clang only when LLVM is set; CLANG_TRIPLE is required by its clang block.
          cat > "$GITHUB_WORKSPACE/make-args.sh" <<'EOF'
          MAKE_ARGS=(O=out ARCH=arm64 SUBARCH=arm64
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            HOSTCC="gcc -fcommon" HOSTCXX=g++)
          if [ "$TOOLCHAIN" = "clang" ]; then
            MAKE_ARGS+=(LLVM=1 CLANG_TRIPLE=aarch64-linux-gnu-)
          fi
          EOF
          # shellcheck disable=SC1091
          source "$GITHUB_WORKSPACE/make-args.sh"

          if [ "$TOOLCHAIN" = "clang" ]; then clang --version | head -1; else aarch64-linux-gnu-gcc --version | head -1; fi

          make "${MAKE_ARGS[@]}" "$DEFCONFIG"

          ./scripts/config --file out/.config -e KSU
          if [ "$KSU_MANUAL_HOOK" = "true" ]; then
            ./scripts/config --file out/.config -e KSU_MANUAL_HOOK
          else
            ./scripts/config --file out/.config -d KSU_MANUAL_HOOK
          fi
          make "${MAKE_ARGS[@]}" olddefconfig

          must() {
            if ! grep -q "^$1\$" out/.config; then
              echo "::error title=Config check failed::$1 missing from final .config"
              exit 1
            fi
          }
          must CONFIG_KSU=y
          must CONFIG_MACH_SONY_POPLAR_KDDI=y
          must CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y
          if [ "$KSU_MANUAL_HOOK" = "true" ]; then must CONFIG_KSU_MANUAL_HOOK=y; else must CONFIG_KSU_KPROBES_HOOK=y; fi
          grep -E '^CONFIG_(KSU|MACH_SONY_|BUILD_ARM64_APPENDED|LOCALVERSION=)' out/.config

      - name: Build
        shell: bash
        run: |
          set -euo pipefail -o pipefail
          cd "$KDIR"
          # shellcheck disable=SC1091
          source "$GITHUB_WORKSPACE/make-args.sh"
          mkdir -p "$ART"
          # Default target builds KBUILD_IMAGE (= Image.gz-dtb from the defconfig) + dtbs + modules.
          make -j"$(nproc)" "${MAKE_ARGS[@]}" 2>&1 | tee "$ART/build.log"

      - name: Verify and collect outputs
        shell: bash
        run: |
          set -euo pipefail
          cd "$KDIR"
          BOOT=out/arch/arm64/boot
          IMG="$BOOT/Image.gz-dtb"

          if [ ! -s "$IMG" ]; then
            echo "::error title=Image missing::$IMG was not produced"
            exit 1
          fi

          mapfile -t FOUND < <(find -L "$BOOT/dts" -name '*.dtb' | sort)
          for d in $DTBS; do
            if ! printf '%s\n' "${FOUND[@]}" | grep -q "/$d\$"; then
              echo "::error title=DTB missing::$d was not built"
              exit 1
            fi
          done
          EXTRA="$(printf '%s\n' "${FOUND[@]}" | grep -v -F -f <(printf '/%s\n' $DTBS) || true)"
          if [ -n "$EXTRA" ]; then
            echo "::warning title=Extra DTBs appended::$(echo "$EXTRA" | tr '\n' ' ')"
          fi

          if ! grep -qE ' [Tt] ksu_' out/System.map; then
            echo "::error title=KernelSU not linked::no ksu_* symbols in out/System.map"
            exit 1
          fi

          # Image.gz-dtb should equal Image.gz + all DTBs (cat). Warning only.
          sum=0; for f in "${FOUND[@]}"; do sum=$((sum + $(stat -c%s "$f"))); done
          gz=$(stat -c%s "$BOOT/Image.gz"); tot=$(stat -c%s "$IMG")
          if [ "$tot" -ne $((gz + sum)) ]; then
            echo "::warning title=Unexpected Image.gz-dtb size::$tot != Image.gz($gz) + dtbs($sum)"
          fi

          mkdir -p "$ART/dtb"
          cp "$IMG" "$BOOT/Image.gz" "$ART/"
          for f in "${FOUND[@]}"; do cp "$f" "$ART/dtb/"; done
          cp "$DEFCONFIG_PATH" "$ART/$DEFCONFIG"
          cp out/.config "$ART/final.config"
          (cd "$ART" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          ls -lh "$ART" "$ART/dtb"

      - name: Build boot.img (only if the repo ships a base boot.img)
        shell: bash
        run: |
          set -euo pipefail
          cd "$KDIR"
          mapfile -t BASES < <(git ls-files | grep -Ei '(^|/)(boot|boot-base|stock-boot)\.img$' || true)

          if [ "${#BASES[@]}" -eq 0 ]; then
            cat > "$ART/BOOT_IMG_NOT_BUILT.txt" <<'EOF'
          boot.img was NOT created. The kernel repo contains no base boot.img (and therefore no
          ramdisk or mkbootimg parameters). Missing inputs:
            1. a known-good boot.img for SOV36 poplar_kddi (same ROM/Android version you will flash)
            2. its ramdisk and header parameters (cmdline, base, offsets, pagesize, header_version, os_version)
          Commit the stock/ROM boot.img to the kernel repo (e.g. boot.img at the repo root) and re-run:
          the workflow will unpack it, keep ramdisk + parameters, and swap in Image.gz-dtb.
          EOF
            echo "::notice title=boot.img skipped::no base boot.img in repo; see BOOT_IMG_NOT_BUILT.txt"
            exit 0
          fi
          if [ "${#BASES[@]}" -gt 1 ]; then
            echo "::error title=Ambiguous base boot.img::found ${BASES[*]}"
            exit 1
          fi

          git clone --depth 1 https://android.googlesource.com/platform/system/tools/mkbootimg "$RUNNER_TEMP/mkbootimg"
          python3 "$RUNNER_TEMP/mkbootimg/unpack_bootimg.py" --boot_img "${BASES[0]}" \
            --out "$RUNNER_TEMP/unpacked" --format=mkbootimg > "$RUNNER_TEMP/mkbootimg_args.txt"
          python3 - <<'EOF'
          import os, shlex, subprocess
          tmp = os.environ["RUNNER_TEMP"]
          args = shlex.split(open(f"{tmp}/mkbootimg_args.txt").read())
          i = args.index("--kernel")
          args[i + 1] = os.path.join(os.environ["ART"], "Image.gz-dtb")
          subprocess.check_call(["python3", f"{tmp}/mkbootimg/mkbootimg.py", *args, "-o", os.path.join(os.environ["ART"], "boot.img")])
          EOF
          (cd "$ART" && sha256sum boot.img >> SHA256SUMS)

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### poplar_kddi kernel build"
            echo "- branch: \`$BRANCH\`  toolchain: \`$TOOLCHAIN\`  manual KSU hook: \`$KSU_MANUAL_HOOK\`"
            echo "- defconfig: \`${DEFCONFIG:-n/a}\`  dtb: \`${DTBS:-n/a}\`"
            if [ -f "$ART/boot.img" ]; then echo "- boot.img: built"; else echo "- boot.img: not built (see BOOT_IMG_NOT_BUILT.txt)"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-poplar_kddi-run${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

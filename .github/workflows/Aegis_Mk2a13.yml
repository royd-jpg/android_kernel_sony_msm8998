      - name: Apply SUSFS (faryx a9b98d40 kernel side + KernelSU-Next 4cc162e0)
        if: ${{ inputs.enable_susfs }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$KDIR"
          FX="$RUNNER_TEMP/faryx"; P="$RUNNER_TEMP/patches"; mkdir -p "$P"
          fx() { git -C "$FX" diff "$FARYX_SHA^" "$FARYX_SHA" -- "$@"; }

          cat > "$RUNNER_TEMP/filter_hunks.py" <<'PY'
          #!/usr/bin/env python3
          """Reduce the faryx diff for fs/namespace.c to its SUSFS-owned changes.
          The commit also reverts two unrelated backports (vfs_submount(), mntns_owner()). Any contiguous block of
          '-' lines mentioning either name is turned into context so those functions stay; every other change is kept.
          Hunks left with no +/- lines are dropped. Output is meant for `git apply --recount`."""
          import re, sys
          src, dst = sys.argv[1], sys.argv[2]
          t = open(src).read()
          head, *hunks = re.split(r'(?m)^(?=@@ )', t)
          UNRELATED = re.compile(r'vfs_submount|mntns_owner')
          out, kept, neutralized = [], 0, 0
          for h in hunks:
              lines = h.split("\n")
              hdr, body = lines[0], lines[1:]
              i = 0
              while i < len(body):
                  if body[i].startswith("-") and not body[i].startswith("---"):
                      j = i
                      while j < len(body) and body[j].startswith("-") and not body[j].startswith("---"):
                          j += 1
                      if any(UNRELATED.search(l) for l in body[i:j]):
                          for k in range(i, j):
                              body[k] = " " + body[k][1:]
                          neutralized += 1
                      i = j
                  else:
                      i += 1
              if not any(l.startswith(("+", "-")) and not l.startswith(("+++", "---")) for l in body):
                  continue
              out.append("\n".join([hdr] + body)); kept += 1
          open(dst, "w").write(head + "".join(out))
          print(f"kept {kept} of {len(hunks)} hunks, neutralized {neutralized} unrelated removal block(s)")
          PY
          python3 -c "import ast,sys; ast.parse(open('$RUNNER_TEMP/filter_hunks.py').read())"

          # 1) kernel side: new core files + SUS_MOUNT hunks of fs/namespace.c (unrelated reverts neutralized)
          fx fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h > "$P/susfs-new.diff"
          fx fs/namespace.c > "$P/namespace-full.diff"
          [ -s "$P/susfs-new.diff" ] && [ -s "$P/namespace-full.diff" ] || { echo "::error::empty faryx diff for SUSFS files"; exit 1; }
          python3 "$RUNNER_TEMP/filter_hunks.py" "$P/namespace-full.diff" "$P/namespace.diff"
          git apply --check --recount --whitespace=nowarn "$P/susfs-new.diff" "$P/namespace.diff"
          git apply --recount --whitespace=nowarn "$P/susfs-new.diff" "$P/namespace.diff"

          # 2) fs/Makefile: one deterministic line (the faryx hunk is not used)
          python3 - <<'PY'
          p = "fs/Makefile"; s = open(p).read()
          line = "obj-$(CONFIG_KSU_SUSFS) += susfs.o\n"
          assert line not in s, "fs/Makefile already has susfs.o"
          open(p, "w").write(s + ("" if s.endswith("\n") else "\n") + line)
          PY

          # 3) KSUN calls susfs_run_sus_path_loop() from kernel/hook/setuid_hook.c; faryx declared it static
          sed -i 's/^static void susfs_run_sus_path_loop(void)/void susfs_run_sus_path_loop(void)/' fs/susfs.c

          # 4) sanity: expected content landed, unrelated functions survived
          grep -q '^#define SUSFS_VERSION "v2.3.0"' include/linux/susfs.h || { echo "::error::unexpected SUSFS_VERSION"; exit 1; }
          grep -q '^void susfs_run_sus_path_loop(void)' fs/susfs.c || { echo "::error::susfs_run_sus_path_loop still static"; exit 1; }
          [ "$(grep -c 'susfs_get_non_sus_' fs/namespace.c)" -ge 2 ] || { echo "::error::SUS_MOUNT helpers missing in fs/namespace.c"; exit 1; }
          grep -q 'vfs_submount' fs/namespace.c && grep -q 'mntns_owner' fs/namespace.c || { echo "::error::unrelated functions were removed"; exit 1; }
          grep -q 'susfs.o' fs/Makefile || { echo "::error::fs/Makefile not updated"; exit 1; }

          # 5) KernelSU-Next side: the SUSFS commit, fetched by SHA, must sit directly on a commit that the pin contains.
          #    It is applied as working-tree changes only (cherry-pick -n): KernelSU-Next HEAD stays at the pin and the
          #    result does not depend on committer identity/date. The resulting diff hash is recorded and re-checked after the build.
          git -C KernelSU-Next fetch -q origin "$KSUN_SUSFS_SHA"
          [ "$(git -C KernelSU-Next rev-parse FETCH_HEAD)" = "$KSUN_SUSFS_SHA" ] || { echo "::error::fetched KSUN SUSFS commit is not $KSUN_SUSFS_SHA"; exit 1; }
          git -C KernelSU-Next merge-base --is-ancestor "$KSUN_SUSFS_SHA^" "$KSUN_SHA" \
            || { echo "::error::parent of $KSUN_SUSFS_SHA is not contained in the pinned KernelSU-Next $KSUN_SHA"; exit 1; }
          git -C KernelSU-Next cherry-pick -n "$KSUN_SUSFS_SHA" >/dev/null \
            || { echo "::error::applying KSUN SUSFS commit failed"; git -C KernelSU-Next status --short | head; exit 1; }
          [ "$(git -C KernelSU-Next rev-parse HEAD)" = "$KSUN_SHA" ] || { echo "::error::KernelSU-Next HEAD moved"; exit 1; }
          grep -q 'KSU_SUSFS' KernelSU-Next/kernel/Kconfig || { echo "::error::KernelSU-Next Kconfig lacks KSU_SUSFS after applying the commit"; exit 1; }
          git -C KernelSU-Next diff HEAD | sha256sum | cut -d' ' -f1 > "$RUNNER_TEMP/ksun_susfs_diff.sha256"
          git -C KernelSU-Next diff HEAD > "$ART/ksun-susfs.diff"
          echo "SUSFS applied: faryx $FARYX_SHA subset + KSUN $KSUN_SUSFS_SHA (diff sha256 $(cat "$RUNNER_TEMP/ksun_susfs_diff.sha256"))"

      - name: Apply NoMount v2.2.0 (upstream maxsteeel/nomount + 4.4 compat script)
        if: ${{ inputs.enable_nomount }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$KDIR"
          NM="$RUNNER_TEMP/nomount-upstream"
          rm -rf "$NM"; mkdir -p "$NM"

          # 1) fetch the pinned upstream tag and prove it is the commit we reviewed
          git -C "$NM" init -q
          git -C "$NM" fetch -q --depth=1 "$NOMOUNT_REPO" "refs/tags/$NOMOUNT_TAG"
          got="$(git -C "$NM" rev-parse 'FETCH_HEAD^{commit}')"
          [ "$got" = "$NOMOUNT_SHA" ] || { echo "::error::upstream tag $NOMOUNT_TAG resolves to $got, expected $NOMOUNT_SHA"; exit 1; }
          git -C "$NM" checkout -q FETCH_HEAD
          echo "NoMount upstream: $(git -C "$NM" log -1 --format='%h %ad %s' --date=short)"

          # 2) kernel/src must hold exactly the four files this workflow knows how to wire
          have="$(ls "$NM/kernel/src" | sort | tr '\n' ' ')"
          [ "$have" = "Kconfig Makefile nomount.c nomount.h " ] || { echo "::error::unexpected files in upstream kernel/src: $have"; exit 1; }
          grep -qx "#define NOMOUNT_BASE_VERSION \"$NOMOUNT_PROTO\"" "$NM/kernel/src/nomount.h" \
            || { echo "::error::upstream nomount.h is not driver protocol $NOMOUNT_PROTO"; exit 1; }

          # 3) copy as plain files (no symlink: upstream's Makefile would otherwise walk up looking for a .git of the nomount repo)
          mkdir -p fs/nomount
          cp -f "$NM/kernel/src/Kconfig" "$NM/kernel/src/Makefile" "$NM/kernel/src/nomount.c" "$NM/kernel/src/nomount.h" fs/nomount/

          # 4) 4.4 compat port (exact-match edits; any miss aborts the build)
          cat > "$RUNNER_TEMP/nomount_44_compat.py" <<'PY'
          #!/usr/bin/env python3
          """Forward-port NoMount v2.2.0 (upstream maxsteeel/nomount kernel/src) to Linux 4.4.

          Every edit is an exact-string replacement that must match exactly once, otherwise this script exits non-zero.
          Usage: nomount_44_compat.py <dir containing nomount.c / nomount.h>"""
          import sys, os

          d = sys.argv[1]
          H = os.path.join(d, "nomount.h")
          C = os.path.join(d, "nomount.c")
          h = open(H).read()
          c = open(C).read()

          def rep(s, old, new, name):
              n = s.count(old)
              if n != 1:
                  sys.exit("compat patch '%s': expected exactly 1 match, found %d" % (name, n))
              return s.replace(old, new)

          # ---------------------------------------------------------------- nomount.h
          # 1) shims placed right before the existing '/* * Compat macros * */' block (all system headers are already included)
          h = rep(h, "/* * Compat macros * */\n", r'''/* * 4.4 compat shims (added by the Aegis CI port; upstream v2.2.0 supports >= 4.11) * */
          #if LINUX_VERSION_CODE < KERNEL_VERSION(4, 16, 0)
          /* full_name_hash() gained a salt argument in 4.16 */
          #define full_name_hash(salt, name, len) full_name_hash((name), (len))
          #endif
          #if LINUX_VERSION_CODE < KERNEL_VERSION(4, 6, 0)
          #define in_compat_syscall() is_compat_task()
          #endif
          #if LINUX_VERSION_CODE >= KERNEL_VERSION(4, 7, 0)
          #define NM_HAS_ITERATE_SHARED 1
          #endif
          #if LINUX_VERSION_CODE < KERNEL_VERSION(4, 9, 0)
          /* xattr_handler.{get,set} gained a struct inode * parameter in 4.9; vfs_{get,set}xattr() keep their dentry API */
          #define NM_XATTR_INODE_ARG      /* nothing */
          #else
          #define NM_XATTR_INODE_ARG      , struct inode *inode
          #endif

          /* * Compat macros * */
          ''', "h:shims")

          # 2) nm_call_iterate
          h = rep(h, '''    if (fop->iterate_shared)
                  return fop->iterate_shared(file, ctx);
          #if LINUX_VERSION_CODE < KERNEL_VERSION(6, 6, 0)
              else if (fop->iterate)
                  return fop->iterate(file, ctx);
          #endif
              return -ENOTDIR;''', '''#ifdef NM_HAS_ITERATE_SHARED
              if (fop->iterate_shared)
                  return fop->iterate_shared(file, ctx);
          #endif
          #if LINUX_VERSION_CODE < KERNEL_VERSION(6, 6, 0)
              if (fop->iterate)
                  return fop->iterate(file, ctx);
          #endif
              return -ENOTDIR;''', "h:nm_call_iterate")

          # 3) nm_get_nm_fop
          h = rep(h, '''    if (fop->iterate_shared == nm_hijacked_iterate_dir)
                  return container_of(fop, struct nm_dir_ops, fake_fop);
          #if LINUX_VERSION_CODE < KERNEL_VERSION(6, 6, 0)''', '''#ifdef NM_HAS_ITERATE_SHARED
              if (fop->iterate_shared == nm_hijacked_iterate_dir)
                  return container_of(fop, struct nm_dir_ops, fake_fop);
          #endif
          #if LINUX_VERSION_CODE < KERNEL_VERSION(6, 6, 0)''', "h:nm_get_nm_fop")

          # ---------------------------------------------------------------- nomount.c
          # 4) get_link (4.5+) vs follow_link (4.4)
          c = rep(c, '''static const char *nm_get_link(struct dentry *dentry, struct inode *inode, struct delayed_call *done)
          {''', '''#if LINUX_VERSION_CODE < KERNEL_VERSION(4, 5, 0)
          /* Linux 4.4: follow_link(dentry, cookie **) replaces get_link() */
          static const char *nm_follow_link(struct dentry *dentry, void **cookie)
          {
              struct inode *v_inode = d_backing_inode(dentry);
              struct nm_inode_info *info = v_inode->i_private;
              struct inode *real_inode;
              if (unlikely(!info || !info->r_path.dentry)) return ERR_PTR(-ECHILD);

              real_inode = d_backing_inode(info->r_path.dentry);
              if (real_inode && real_inode->i_op && real_inode->i_op->follow_link)
                  return real_inode->i_op->follow_link(info->r_path.dentry, cookie);

              return ERR_PTR(-EINVAL);
          }
          #else
          static const char *nm_get_link(struct dentry *dentry, struct inode *inode, struct delayed_call *done)
          {''', "c:get_link open")
          c = rep(c, '''        return real_inode->i_op->get_link(target_dentry, real_inode, done);
              }

              return ERR_PTR(-EINVAL);
          }
          ''', '''        return real_inode->i_op->get_link(target_dentry, real_inode, done);
              }

              return ERR_PTR(-EINVAL);
          }
          #endif
          ''', "c:get_link close")
          c = rep(c, '''    .listxattr = nm_listxattr,
              .get_link = nm_get_link,
          };''', '''    .listxattr = nm_listxattr,
          #if LINUX_VERSION_CODE >= KERNEL_VERSION(4, 5, 0)
              .get_link = nm_get_link,
          #else
              .follow_link = nm_follow_link,
          #endif
          };''', "c:file_iops")

          # 5) xattr handlers
          c = rep(c, '''static int nm_xattr_get(const struct xattr_handler *handler, struct dentry *dentry, struct inode *inode, const char *name, void *buffer, size_t size FLAGS_ARG)
          {
              struct nm_xattr_proxy *proxy = container_of(handler, struct nm_xattr_proxy, fake);
              if (nm_inode_is_virtual(inode)) {
                  struct nm_inode_info *info = inode->i_private;
                  if (unlikely(!info || !info->r_path.dentry)) return -ENODATA;
                  return __vfs_getxattr(info->r_path.dentry, d_inode(info->r_path.dentry), xattr_full_name(handler, name), buffer, size FLAGS_VAL);
              }

              return proxy->orig->get(proxy->orig, dentry, inode, name, buffer, size FLAGS_VAL);
          }''', '''static int nm_xattr_get(const struct xattr_handler *handler, struct dentry *dentry NM_XATTR_INODE_ARG, const char *name, void *buffer, size_t size FLAGS_ARG)
          {
              struct nm_xattr_proxy *proxy = container_of(handler, struct nm_xattr_proxy, fake);
          #if LINUX_VERSION_CODE < KERNEL_VERSION(4, 9, 0)
              struct inode *inode = d_backing_inode(dentry);
          #endif
              if (nm_inode_is_virtual(inode)) {
                  struct nm_inode_info *info = inode->i_private;
                  if (unlikely(!info || !info->r_path.dentry)) return -ENODATA;
          #if LINUX_VERSION_CODE < KERNEL_VERSION(4, 9, 0)
                  return vfs_getxattr(info->r_path.dentry, xattr_full_name(handler, name), buffer, size);
          #else
                  return __vfs_getxattr(info->r_path.dentry, d_inode(info->r_path.dentry), xattr_full_name(handler, name), buffer, size FLAGS_VAL);
          #endif
              }

          #if LINUX_VERSION_CODE < KERNEL_VERSION(4, 9, 0)
              return proxy->orig->get(proxy->orig, dentry, name, buffer, size);
          #else
              return proxy->orig->get(proxy->orig, dentry, inode, name, buffer, size FLAGS_VAL);
          #endif
          }''', "c:xattr_get")
          c = rep(c, '''static int nm_xattr_set(const struct xattr_handler *handler, IDMAP_ARG struct dentry *dentry, struct inode *inode, const char *name, const void *buffer, size_t size, int flags)
          {
              struct nm_xattr_proxy *proxy = container_of(handler, struct nm_xattr_proxy, fake);
              if (nm_inode_is_virtual(inode)) {
                  struct nm_inode_info *info = inode->i_private;
                  if (unlikely(!info || !info->r_path.dentry)) return -ENODATA;
                  return __vfs_setxattr(IDMAP_PATH(info->r_path) info->r_path.dentry, d_inode(info->r_path.dentry), xattr_full_name(handler, name), buffer, size, flags);
              }
              return proxy->orig->set(proxy->orig, IDMAP_CALL dentry, inode, name, buffer, size, flags);
          }''', '''static int nm_xattr_set(const struct xattr_handler *handler, IDMAP_ARG struct dentry *dentry NM_XATTR_INODE_ARG, const char *name, const void *buffer, size_t size, int flags)
          {
              struct nm_xattr_proxy *proxy = container_of(handler, struct nm_xattr_proxy, fake);
          #if LINUX_VERSION_CODE < KERNEL_VERSION(4, 9, 0)
              struct inode *inode = d_backing_inode(dentry);
          #endif
              if (nm_inode_is_virtual(inode)) {
                  struct nm_inode_info *info = inode->i_private;
                  if (unlikely(!info || !info->r_path.dentry)) return -ENODATA;
          #if LINUX_VERSION_CODE < KERNEL_VERSION(4, 9, 0)
                  return vfs_setxattr(info->r_path.dentry, xattr_full_name(handler, name), buffer, size, flags);
          #else
                  return __vfs_setxattr(IDMAP_PATH(info->r_path) info->r_path.dentry, d_inode(info->r_path.dentry), xattr_full_name(handler, name), buffer, size, flags);
          #endif
              }
          #if LINUX_VERSION_CODE < KERNEL_VERSION(4, 9, 0)
              return proxy->orig->set(proxy->orig, dentry, name, buffer, size, flags);
          #else
              return proxy->orig->set(proxy->orig, IDMAP_CALL dentry, inode, name, buffer, size, flags);
          #endif
          }''', "c:xattr_set")

          # 6) directory file_operations / hijack: iterate_shared exists from 4.7
          c = rep(c, '''    .iterate_shared = nm_dir_iterate_dir,
          #if LINUX_VERSION_CODE < KERNEL_VERSION(6, 6, 0)
              .iterate = nm_dir_iterate_dir,
          #endif''', '''#ifdef NM_HAS_ITERATE_SHARED
              .iterate_shared = nm_dir_iterate_dir,
          #endif
          #if LINUX_VERSION_CODE < KERNEL_VERSION(6, 6, 0)
              .iterate = nm_dir_iterate_dir,
          #endif''', "c:dir_fops")
          c = rep(c, '''    bool iterate = fop && (fop->iterate_shared
          #if LINUX_VERSION_CODE < KERNEL_VERSION(6, 6, 0)
                  || fop->iterate
          #endif
              );''', '''    bool iterate = fop && (0
          #ifdef NM_HAS_ITERATE_SHARED
                  || fop->iterate_shared
          #endif
          #if LINUX_VERSION_CODE < KERNEL_VERSION(6, 6, 0)
                  || fop->iterate
          #endif
              );''', "c:hijack iterate flag")
          c = rep(c, '''        if (fop->iterate_shared) ops->fake_fop.iterate_shared = nm_hijacked_iterate_dir;
          #if LINUX_VERSION_CODE < KERNEL_VERSION(6, 6, 0)''', '''#ifdef NM_HAS_ITERATE_SHARED
                  if (fop->iterate_shared) ops->fake_fop.iterate_shared = nm_hijacked_iterate_dir;
          #endif
          #if LINUX_VERSION_CODE < KERNEL_VERSION(6, 6, 0)''', "c:hijack fake_fop")

          open(H, "w").write(h)
          open(C, "w").write(c)
          print("NoMount 4.4 compat patch applied (%s)" % d)
          PY
          python3 "$RUNNER_TEMP/nomount_44_compat.py" fs/nomount

          # 5) wire into fs/Kconfig (before the last `endmenu`, as upstream setup.sh does) and fs/Makefile
          python3 - <<'PY'
          p = "fs/Makefile"; s = open(p).read()
          assert "nomount" not in s, "fs/Makefile already wired for NoMount"
          open(p, "w").write(s + ("" if s.endswith("\n") else "\n") + "obj-$(CONFIG_NOMOUNT)\t\t+= nomount/\n")
          p = "fs/Kconfig"; lines = open(p).read().split("\n")
          assert not any("nomount" in l for l in lines), "fs/Kconfig already wired for NoMount"
          idx = max(i for i, l in enumerate(lines) if l.startswith("endmenu"))
          lines.insert(idx, 'source "fs/nomount/Kconfig"')
          open(p, "w").write("\n".join(lines))
          PY
          grep -q 'source "fs/nomount/Kconfig"' fs/Kconfig || { echo "::error::fs/Kconfig does not source fs/nomount/Kconfig"; exit 1; }
          grep -q 'nomount/' fs/Makefile || { echo "::error::fs/Makefile not updated"; exit 1; }
          grep -q 'NM_HAS_ITERATE_SHARED' fs/nomount/nomount.h || { echo "::error::compat patch not present in fs/nomount/nomount.h"; exit 1; }
          echo "NoMount applied: upstream $NOMOUNT_TAG ($(grep -E 'define NOMOUNT_BASE_VERSION' fs/nomount/nomount.h)) + 4.4 compat patch"

      - name: Apply Baseband-guard (faryx files + SELinux hunks)
        if: ${{ inputs.enable_bbg }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$KDIR"
          FX="$RUNNER_TEMP/faryx"; P="$RUNNER_TEMP/patches"; mkdir -p "$P"
          [ ! -e Baseband-guard ] && [ ! -e security/baseband-guard ] || { echo "::error::Baseband-guard already present"; exit 1; }

          # Same layout as the commit: Baseband-guard/ at the tree root, reached through two symlinks.
          git -C "$FX" archive "$FARYX_SHA" Baseband-guard | tar -x -C "$KDIR"
          for f in Kconfig Makefile baseband_guard.c baseband_guard.h blkdev_helper.c blkdev_helper.h kernel_compat.h \
                   tracing/Makefile tracing/tracing.c tracing/tracing.h; do
            [ -s "Baseband-guard/$f" ] || { echo "::error::Baseband-guard/$f missing after extraction"; exit 1; }
          done
          ln -s ../Baseband-guard security/baseband-guard
          ln -s ../../../Baseband-guard/tracing/tracing.h security/selinux/include/bbg_tracing.h
          [ -f security/baseband-guard/Kconfig ] && [ -f security/selinux/include/bbg_tracing.h ] \
            || { echo "::error::Baseband-guard symlinks do not resolve"; exit 1; }

          # objsec.h (bbg_cred in task_security_struct) and selinux/Makefile: the commit's own hunks.
          git -C "$FX" diff "$FARYX_SHA^" "$FARYX_SHA" -- security/selinux/include/objsec.h security/selinux/Makefile > "$P/bbg.diff"
          [ -s "$P/bbg.diff" ] || { echo "::error::empty faryx diff for Baseband-guard hunks"; exit 1; }
          git apply --check --recount --whitespace=nowarn "$P/bbg.diff"
          git apply --recount --whitespace=nowarn "$P/bbg.diff"

          # security/Makefile and security/Kconfig: one line each, same as the commit.
          python3 - <<'PY'
          for p, line in (("security/Makefile", "obj-$(CONFIG_BBG) += baseband-guard/\n"),
                          ("security/Kconfig", 'source "security/baseband-guard/Kconfig"\n')):
              s = open(p).read()
              assert line.strip() not in s, p + " already wired for Baseband-guard"
              open(p, "w").write(s + ("" if s.endswith("\n") else "\n") + line)
          PY
          grep -q 'bbg_cred' security/selinux/include/objsec.h || { echo "::error::objsec.h lacks bbg_cred"; exit 1; }
          grep -q 'baseband-guard/' security/Makefile || { echo "::error::security/Makefile not updated"; exit 1; }
          grep -q 'baseband-guard/Kconfig' security/Kconfig || { echo "::error::security/Kconfig not updated"; exit 1; }
          echo "Baseband-guard applied: $(git -C "$FX" log -1 --format=%h "$FARYX_SHA") (BBG_BLOCK_BOOT/RECOVERY stay off)"

      - name: Preflight B — post-patch checks (hooks exactly once, KSUN Kbuild guards satisfied, record delta)
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$KDIR"
          cnt() { grep -cF -- "$2" "$1" || true; }
          eq()  { local n; n="$(cnt "$1" "$2")"; [ "$n" -eq "$3" ] || { echo "::error::$1: '$2' occurs $n times, expected $3"; exit 1; }; }
          if [ "$ENABLE_KSUN" = "true" ]; then
            # every hook / backport exactly once (no duplicate declarations or call sites)
            eq fs/exec.c 'ksu_handle_execveat(' 3
            eq fs/open.c 'ksu_handle_faccessat(' 2
            eq fs/stat.c 'ksu_handle_stat(' 2
            eq fs/read_write.c 'ksu_handle_sys_read(' 2
            eq fs/read_write.c 'ksu_vfs_read_hook' 2
            eq kernel/reboot.c 'ksu_handle_sys_reboot(' 2
            eq security/selinux/hooks.c 'is_ksu_transition(' 2
            eq security/selinux/ss/services.c 'is_ksu_transition(' 2
            eq include/linux/seccomp.h 'atomic_t filter_count;' 1
            # the inode accessor signature is split across lines by the patch, so check with whitespace-normalising regexes
            python3 - <<'PY'
          import re
          s = open("security/selinux/include/objsec.h").read()
          n = lambda p: len(re.findall(p, s))
          assert n(r'selinux_inode\(\s*const struct inode \*inode\)') == 1, "selinux_inode definition count"
          assert n(r'selinux_cred\(const struct cred \*cred\)') == 1, "selinux_cred definition count"
          assert re.search(r'selinux_inode\(\s*const struct inode \*inode\)\s*\{\s*return inode->i_security;\s*\}', s), "selinux_inode is not the identity accessor"
          assert re.search(r'selinux_cred\(const struct cred \*cred\)\s*\{\s*return cred->security;\s*\}', s), "selinux_cred is not the identity accessor"
          PY
            eq fs/internal.h 'int path_umount(struct path *path, int flags);' 1
            [ "$(grep -cE '^static int can_umount' fs/namespace.c)" -eq 1 ] || { echo "::error::can_umount count"; exit 1; }
            [ "$(grep -cE '^int path_umount' fs/namespace.c)" -eq 1 ] || { echo "::error::path_umount count"; exit 1; }
            # KSUN Kbuild sed-patches the tree at make-parse time when any of these guards fails (racy with -j). They must all pass now.
            g() { grep -qE -- "$2" "$1" || { echo "::error::KSUN Kbuild guard would fire: '$2' absent from $1 (Kbuild would mutate the tree mid-build)"; exit 1; }; }
            g fs/namespace.c '^static int can_umount'
            g fs/namespace.c '^int path_umount'
            g fs/internal.h '^int path_umount'
            g include/linux/seccomp.h 'atomic_t filter_count;'
            g security/selinux/hooks.c 'selinux_inode\(inode\)'
            g security/selinux/hooks.c 'selinux_cred'
            g security/selinux/selinuxfs.c 'selinux_inode\(inode\)'
            g security/selinux/xfrm.c 'selinux_cred'
            g security/selinux/include/objsec.h 'selinux_inode'
            g security/selinux/include/objsec.h 'task_security_struct[[:space:]]+\*selinux_cred'
            g kernel/reboot.c 'ksu_handle_sys_reboot'
            # no raw accessor sites left that Kbuild's sed would rewrite for inode (hooks.c declarations / returns)
            if grep -nE 'struct inode_security_struct \*isec = inode->i_security|return inode->i_security' security/selinux/hooks.c; then
              echo "::error::unconverted inode->i_security accessor sites remain in hooks.c"; exit 1
            fi
            # accessor bodies must be the identity wrappers (SELinux semantics unchanged)
            [ "$(git -C KernelSU-Next rev-parse HEAD)" = "$KSUN_SHA" ] || { echo "::error::KernelSU-Next moved"; exit 1; }
            if [ "$ENABLE_SUSFS" = "true" ]; then
              # the SUSFS commit is applied as working-tree changes; HEAD stays at the pin and the diff must equal the recorded one
              [ "$(git -C KernelSU-Next diff HEAD | sha256sum | cut -d' ' -f1)" = "$(cat "$RUNNER_TEMP/ksun_susfs_diff.sha256")" ] \
                || { echo "::error::KernelSU-Next worktree differs from the recorded SUSFS diff"; exit 1; }
              [ -f fs/susfs.c ] && [ -f include/linux/susfs.h ] && grep -q 'CONFIG_KSU_SUSFS) += susfs.o' fs/Makefile \
                || { echo "::error::SUSFS kernel side not wired"; exit 1; }
            else
              [ -z "$(git -C KernelSU-Next status --porcelain)" ] || { echo "::error::KernelSU-Next work tree not clean"; exit 1; }
              [ ! -e fs/susfs.c ] && [ ! -e include/linux/susfs.h ] || { echo "::error::SUSFS files present with enable_susfs=false"; exit 1; }
            fi
          else
            [ ! -e KernelSU-Next ] && [ ! -e drivers/kernelsu ] || { echo "::error::KSU files present with enable_ksun=false"; exit 1; }
            if grep -rIl -e 'CONFIG_KSU' -e 'ksu_handle_' -e 'is_ksu_transition' --include='*.c' --include='*.h' fs kernel security drivers include; then
              echo "::error::KSU references present with enable_ksun=false"; exit 1
            fi
          fi
          if [ "$ENABLE_KSUN" != "true" ] && { [ -e fs/susfs.c ] || [ -e include/linux/susfs.h ]; }; then echo "::error::SUSFS files present with enable_ksun=false"; exit 1; fi
          if [ "$ENABLE_BBG" = "true" ]; then
            eq security/selinux/include/objsec.h 'struct bbg_cred_security_struct  bbg_cred;' 1
          else
            [ ! -e Baseband-guard ] || { echo "::error::Baseband-guard present with enable_bbg=false"; exit 1; }
          fi
          if [ "$ENABLE_NOMOUNT" != "true" ] && [ -e fs/nomount ]; then echo "::error::fs/nomount present with enable_nomount=false"; exit 1; fi

          # Record the source delta: tracked-file diff + manifest of added trees; Preflight C (after the build) must find them unchanged.
          git diff > "$ART/aegis-source-delta.patch"
          git diff | sha256sum | cut -d' ' -f1 > "$RUNNER_TEMP/delta.sha256"
          {
            echo "# tracked-file delta sha256: $(cat "$RUNNER_TEMP/delta.sha256")"
            echo "# untracked additions (path  sha256)"
            git ls-files --others --exclude-standard -z | { grep -zv '^KernelSU-Next/' || true; } | while IFS= read -r -d '' f; do [ -L "$f" ] || sha256sum -- "$f"; done
            git ls-files --others --exclude-standard | grep -c '^KernelSU-Next/' | sed 's/^/# KernelSU-Next untracked files in parent view: /' || true
            find . -path ./.git -prune -o -type l \( -path './drivers/kernelsu' -o -path './security/baseband-guard' -o -path './security/selinux/include/bbg_tracing.h' \) -printf 'symlink %p -> %l\n'
          } > "$ART/aegis-source-manifest.txt"
          git diff --stat | tail -30
          echo "preflight B OK"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          # arm-linux-gnueabi: CONFIG_COMPAT_VDSO=y needs the 32-bit GNU binutils (vdso32 uses -no-integrated-as).
          # aarch64 GNU binutils/gcc: the tree builds with the non-integrated assembler (LLVM_IAS unset) and --gcc-toolchain.
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev zlib1g-dev make gcc g++ perl python3 cpio kmod \
            xz-utils lz4 zstd zip unzip git curl ca-certificates \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

      - name: Acquire toolchain (AOSP clang-r450784e @ pinned prebuilts commit, no fallback)
        shell: bash
        run: |
          set -Eeuo pipefail
          id="aosp-$CLANG_REV"; dir="$TC/$id"; archive="$TC/$id.tar.gz"
          url="$CLANG_REPO/+archive/$CLANG_PREBUILTS_SHA/clang-$CLANG_REV.tar.gz"
          echo "download URL : $url"
          code="$(curl -sS -L -o "$archive" -w '%{http_code}' --retry 3 --retry-delay 5 --connect-timeout 30 "$url" || true)"; code="${code:-000}"
          echo "download HTTP: $code"
          { [ "$code" = "200" ] && [ -s "$archive" ]; } || { echo "::error::download of $id failed (HTTP $code); there is deliberately no fallback toolchain"; exit 1; }
          echo "archive size  : $(stat -c%s "$archive")"
          echo "archive SHA256: $(sha256sum "$archive" | cut -d' ' -f1)  (googlesource archives are not byte-stable; the pin is the prebuilts commit)"
          rm -rf "$dir"; mkdir -p "$dir"
          tar -xzf "$archive" -C "$dir"; rm -f "$archive"
          [ -x "$dir/bin/clang" ] || { echo "::error::no bin/clang in $id"; exit 1; }
          if ! ver="$("$dir/bin/clang" --version 2>&1)"; then
            need="$(objdump -T "$(readlink -f "$dir/bin/clang")" 2>/dev/null | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -n1)"
            { echo "clang from $id does not execute"; echo "error: $ver"; echo "binary needs: ${need:-unknown}"; echo "host: $(ldd --version 2>&1 | sed -n '1p')"; } | tee "$ART/toolchain-fail.txt"
            exit 1
          fi
          printf '%s\n' "$ver" | tee "$ART/toolchain-clang-version.txt"
          printf '%s\n' "$ver" | sed -n '1p' | grep -qF "clang version $CLANG_VERSION_EXPECT" || { echo "::error::expected clang $CLANG_VERSION_EXPECT"; exit 1; }
          if [ -f "$dir/AndroidVersion.txt" ]; then
            tee "$ART/toolchain-AndroidVersion.txt" < "$dir/AndroidVersion.txt"
            grep -qF "based on $CLANG_REV" "$dir/AndroidVersion.txt" || { echo "::error::AndroidVersion.txt does not say 'based on $CLANG_REV'"; exit 1; }
          else
            echo "::warning::no AndroidVersion.txt in the extracted toolchain"
          fi
          echo "TC_USED=$id" >> "$GITHUB_ENV"
          echo "$dir/bin" >> "$GITHUB_PATH"
          echo "using toolchain $id"

      - name: Configure (defconfig, feature symbols, brand) and verify
        shell: bash
        run: |
          set -euo pipefail
          cd "$KDIR"
          # Flags exactly as Mk1r5 (LLVM=1: clang + ld.lld + llvm-* binutils; LLVM_IAS unset => this tree adds -no-integrated-as and uses the GNU assembler;
          # CROSS_COMPILE_ARM32 for the compat vdso; host tools by GCC).
          cat > "$RUNNER_TEMP/make-args.sh" <<'EOF'
          MAKE_ARGS=(O=out ARCH=arm64 SUBARCH=arm64
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            CC=clang LLVM=1 CLANG_TRIPLE=aarch64-linux-gnu-
            HOSTCC="gcc -fcommon" HOSTCXX=g++
            LOCALVERSION=)   # set-but-empty: stops scripts/setlocalversion appending "+" on an untagged git tree; the brand comes from CONFIG_LOCALVERSION
          EOF
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/make-args.sh"
          rm -rf out

          make "${MAKE_ARGS[@]}" "$DEFCONFIG" </dev/null
          cp out/.config "$ART/config.defconfig-only"      # untouched defconfig resolution = baseline for the delta check

          # --- feature symbols (upstream defconfig has none of them) ---
          if [ "$ENABLE_KSUN" = "true" ]; then
            # CONFIG_KPROBES=y upstream makes KSU_MANUAL_HOOK default to n, so it is forced explicitly; KPROBES hook mode is unsupported < 5.10.
            ./scripts/config --file out/.config -e KSU -e KSU_MANUAL_HOOK -d KSU_KPROBES_HOOK -d KSU_DEBUG
            # SUSFS option set = the 11 symbols of KSUN legacy-susfs (all depend on KSU; KSU_SUSFS also on THREAD_INFO_IN_TASK)
            if [ "$ENABLE_SUSFS" = "true" ]; then
              ./scripts/config --file out/.config -e KSU_SUSFS \
                -e KSU_SUSFS_SUS_PATH -e KSU_SUSFS_SUS_MOUNT -e KSU_SUSFS_SUS_KSTAT -e KSU_SUSFS_TRY_UMOUNT \
                -e KSU_SUSFS_SPOOF_UNAME -e KSU_SUSFS_ENABLE_LOG -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
                -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG -e KSU_SUSFS_OPEN_REDIRECT -e KSU_SUSFS_SUS_MAP
            fi
          fi
          if [ "$ENABLE_NOMOUNT" = "true" ]; then
            ./scripts/config --file out/.config -e NOMOUNT
          fi
          # Baseband-guard boot/recovery blocking stay off: BBG_BLOCK_BOOT would make the AnyKernel3 flash from Android fail.
          if [ "$ENABLE_BBG" = "true" ]; then
            ./scripts/config --file out/.config -e BBG -d BBG_BLOCK_BOOT -d BBG_BLOCK_RECOVERY
          fi
          # Upstream names no DTB; Image.gz-dtb must carry exactly the poplar_kddi DTB.
          ./scripts/config --file out/.config --set-str BUILD_ARM64_APPENDED_DTB_IMAGE_NAMES "qcom/${DTB_NAME%.dtb}"
          # Branding: force LOCALVERSION and drop the git-derived auto suffix so the release string is exactly <kernelversion><BRAND>.
          ./scripts/config --file out/.config --set-str LOCALVERSION "$BRAND" -d LOCALVERSION_AUTO
          make "${MAKE_ARGS[@]}" olddefconfig </dev/null

          # Resolution must be stable and prompt-free: a second pass changes nothing, and silentoldconfig (run by the real build) must not need input.
          cp out/.config "$RUNNER_TEMP/config.pass1"
          make "${MAKE_ARGS[@]}" olddefconfig </dev/null
          cmp -s out/.config "$RUNNER_TEMP/config.pass1" || { echo "::error::config not stable across olddefconfig passes"; diff "$RUNNER_TEMP/config.pass1" out/.config | head -40; exit 1; }
          make "${MAKE_ARGS[@]}" silentoldconfig </dev/null

          if EMPTY="$(grep -nE '^CONFIG_[A-Za-z0-9_]+=$' out/.config)"; [ -n "$EMPTY" ]; then
            echo "::error::empty config values (would prompt): $(echo "$EMPTY" | tr '\n' ' ')"; exit 1
          fi
          must() { grep -qxF -- "$1" out/.config || { echo "::error::missing in resolved .config: $1"; exit 1; }; }
          mustnot() { if grep -qxE -- "$1" out/.config; then echo "::error::unexpected in resolved .config: $1"; exit 1; fi; }
          must CONFIG_MACH_SONY_POPLAR_KDDI=y
          must CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y
          must 'CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE_NAMES="qcom/msm8998-v2.1-yoshino-poplar_kddi"'
          must "CONFIG_LOCALVERSION=\"$BRAND\""
          mustnot 'CONFIG_LOCALVERSION_AUTO=y'
          mustnot 'CONFIG_MACH_SONY_(MAPLE|MAPLE_DSDS|POPLAR|POPLAR_DSDS|LILAC|LILAC_DCM)=y'
          mustnot 'CONFIG_KSU_(KPROBES_HOOK|TRACEPOINT_HOOK)=y'
          # security posture inherited from the defconfig must survive
          must CONFIG_SECURITY_SELINUX=y
          must CONFIG_DEFAULT_SECURITY_SELINUX=y
          must CONFIG_SECCOMP=y
          must CONFIG_SECCOMP_FILTER=y
          if [ "$ENABLE_KSUN" = "true" ]; then
            must CONFIG_KSU=y
            must CONFIG_KSU_MANUAL_HOOK=y
            mustnot 'CONFIG_KSU_DEBUG=y'
            if [ "$ENABLE_SUSFS" = "true" ]; then
              must CONFIG_THREAD_INFO_IN_TASK=y
              for o in KSU_SUSFS KSU_SUSFS_SUS_PATH KSU_SUSFS_SUS_MOUNT KSU_SUSFS_SUS_KSTAT KSU_SUSFS_TRY_UMOUNT \
                       KSU_SUSFS_SPOOF_UNAME KSU_SUSFS_ENABLE_LOG KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
                       KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG KSU_SUSFS_OPEN_REDIRECT KSU_SUSFS_SUS_MAP; do
                must "CONFIG_$o=y"
              done
            else
              mustnot 'CONFIG_KSU_SUSFS[A-Z_]*=[ym]'
            fi
          else
            mustnot 'CONFIG_KSU(_[A-Z_]+)?=[ym]'
          fi
          if [ "$ENABLE_NOMOUNT" = "true" ]; then must CONFIG_NOMOUNT=y; else mustnot 'CONFIG_NOMOUNT=[ym]'; fi
          if [ "$ENABLE_BBG" = "true" ]; then
            must CONFIG_BBG=y
            mustnot 'CONFIG_BBG_BLOCK_(BOOT|RECOVERY)=y'
          else
            mustnot 'CONFIG_BBG=[ym]'
          fi

          # Allow-list on the delta against the untouched defconfig: nothing outside our features (SELinux, seccomp, LSM, audit, ...) may change.
          python3 - "$ART/config.defconfig-only" out/.config "$ART/config-delta.txt" <<'PY'
          import re, sys
          def load(p):
              d = {}
              for l in open(p):
                  l = l.rstrip("\n")
                  m = re.match(r'^(?:# )?CONFIG_([A-Za-z0-9_]+)(?:=(.*)| is not set)$', l)
                  if m:
                      d[m.group(1)] = m.group(2) if m.group(2) is not None else "n"
              return d
          a, b = load(sys.argv[1]), load(sys.argv[2])
          allowed = re.compile(r'^(KSU(_[A-Z_]+)?|NOMOUNT|BBG(_[A-Z_]+)?|LOCALVERSION|LOCALVERSION_AUTO|BUILD_ARM64_APPENDED_DTB_IMAGE_NAMES)$')
          bad, lines = [], []
          for k in sorted(set(a) | set(b)):
              if a.get(k, "<absent>") != b.get(k, "<absent>"):
                  lines.append("%-48s %s -> %s" % (k, a.get(k, "<absent>"), b.get(k, "<absent>")))
                  if not allowed.match(k):
                      bad.append(k)
          open(sys.argv[3], "w").write("\n".join(lines) + "\n")
          print("\n".join(lines))
          if bad:
              sys.exit("::error::config symbols changed outside the allow-list: " + " ".join(bad))
          PY
          grep -E '^(# )?CONFIG_(KSU|NOMOUNT|BBG|MACH_SONY_|BUILD_ARM64_APPENDED|LOCALVERSION|SECURITY_SELINUX|SECCOMP)' out/.config

      - name: Verify toolchain resolution (compiler, linker, GNU cross tools)
        shell: bash
        run: |
          set -euo pipefail
          OUT="$ART/toolchain-resolution.txt"
          : > "$OUT"
          say() { printf '%s\n' "$*" | tee -a "$OUT"; }
          say "toolchain used      : $TC_USED"
          # clang must come from the toolchain installed by this job, not from the runner image (/usr/bin/clang*)
          CLANG_PATH="$(command -v clang || true)"
          [ -n "$CLANG_PATH" ] || { echo "::error::clang not found on PATH"; exit 1; }
          case "$CLANG_PATH" in
            "$TC/$TC_USED"/*) ;;
            *) echo "::error::clang resolves to $CLANG_PATH, expected a path under $TC/$TC_USED"; exit 1 ;;
          esac
          say "clang               : $CLANG_PATH -> $(readlink -f "$CLANG_PATH")"
          "$CLANG_PATH" --version | tee -a "$OUT"
          say "resource dir        : $("$CLANG_PATH" --print-resource-dir)"
          for tgt in aarch64-linux-gnu arm-linux-gnueabi; do
            printf 'int f(void){return 0;}\n' | "$CLANG_PATH" --target="$tgt" -x c -c -o "$RUNNER_TEMP/tc-smoke.o" - \
              || { echo "::error::clang cannot compile for $tgt"; exit 1; }
            say "smoke compile       : $tgt OK"
          done
          rm -f "$RUNNER_TEMP/tc-smoke.o"
          # LLVM=1 in this tree selects these tools (Makefile: LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf STRIP=llvm-strip)
          for t in ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-strip; do
            p="$(command -v "$t" || true)"
            [ -n "$p" ] || { echo "::error::$t not found (required by LLVM=1)"; exit 1; }
            case "$p" in "$TC/$TC_USED"/*) ;; *) echo "::error::$t resolves to $p (outside the pinned toolchain)"; exit 1 ;; esac
            say "$(printf '%-34s : %s' "$t" "$p")"
          done
          p="$(command -v llvm-size || true)"; say "$(printf '%-34s : %s' llvm-size "${p:-not found (informational)}")"
          for t in aarch64-linux-gnu-gcc aarch64-linux-gnu-ld aarch64-linux-gnu-as aarch64-linux-gnu-ar aarch64-linux-gnu-nm \
                   aarch64-linux-gnu-objcopy aarch64-linux-gnu-objdump aarch64-linux-gnu-strip aarch64-linux-gnu-elfedit arm-linux-gnueabi-as arm-linux-gnueabi-ld; do
            p="$(command -v "$t" || true)"
            [ -n "$p" ] || { echo "::error::$t not found (CROSS_COMPILE / CROSS_COMPILE_ARM32 need it)"; exit 1; }
            say "$(printf '%-34s : %s' "$t" "$p")"
          done
          say "HOSTCC              : $(command -v gcc)  ($(gcc --version | sed -n '1p'))"

      - name: Build poplar_kddi DTB and Image.gz-dtb (poplar_kddi DTB only)
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$KDIR"
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/make-args.sh"
          : > "$ART/build.log"
          jobs="$(nproc)"
          echo "=== clang: $(clang --version | head -1)" | tee -a "$ART/build.log"
          # `make | tee` would hide a make failure behind tee's exit status; run make inside a group and read PIPESTATUS explicitly.
          run_make() {
            set +e
            make -j"$jobs" "${MAKE_ARGS[@]}" "$@" 2>&1 | tee -a "$ART/build.log"
            local rc="${PIPESTATUS[0]}"
            set -e
            [ "$rc" -eq 0 ] || { echo "::error::make $* failed (exit $rc); see build.log artifact"; exit "$rc"; }
          }
          # flask.h is generated under security/selinux and included by drivers/kernelsu and security/baseband-guard;
          # generate it first so parallel descent cannot race.
          run_make security/selinux/
          run_make "qcom/$DTB_NAME"
          run_make Image.gz
          cat out/arch/arm64/boot/Image.gz "out/arch/arm64/boot/dts/qcom/$DTB_NAME" > out/arch/arm64/boot/Image.gz-dtb
          echo "BUILD_TC=$TC_USED" >> "$GITHUB_ENV"

      - name: Preflight C — the build must not have modified the patched tree
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$KDIR"
          now="$(git diff | sha256sum | cut -d' ' -f1)"
          want="$(cat "$RUNNER_TEMP/delta.sha256")"
          if [ "$now" != "$want" ]; then
            git diff > "$ART/aegis-source-delta-AFTER-BUILD.patch"
            echo "::error::tracked sources changed during the build (KernelSU-Next/Baseband-guard Kbuild sed-patched the tree?). before=$want after=$now"; exit 1
          fi
          if [ "$ENABLE_KSUN" = "true" ]; then
            [ "$(git -C KernelSU-Next rev-parse HEAD)" = "$KSUN_SHA" ] || { echo "::error::KernelSU-Next HEAD moved during the build"; exit 1; }
            if [ "$ENABLE_SUSFS" = "true" ]; then
              [ "$(git -C KernelSU-Next diff HEAD | sha256sum | cut -d' ' -f1)" = "$(cat "$RUNNER_TEMP/ksun_susfs_diff.sha256")" ] \
                || { echo "::error::KernelSU-Next worktree changed during the build"; exit 1; }
            else
              [ -z "$(git -C KernelSU-Next status --porcelain)" ] || { echo "::error::KernelSU-Next changed during the build"; exit 1; }
            fi
          fi
          echo "tree unchanged by the build (delta sha256 $now)"

      - name: Verify outputs, brand and collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd "$KDIR"
          B=out/arch/arm64/boot

          mapfile -t ALL_DTB < <(find -L "$B/dts" -name '*.dtb' | sort)
          mapfile -t KDDI_DTB < <(find -L "$B/dts" -name '*poplar_kddi*.dtb' | sort)
          echo "all dtbs     : ${ALL_DTB[*]:-none}"
          echo "poplar_kddi  : ${KDDI_DTB[*]:-none}"
          [ "${#KDDI_DTB[@]}" -eq 1 ] || { echo "::error::expected exactly 1 poplar_kddi DTB, found ${#KDDI_DTB[@]}"; exit 1; }
          [ "$(basename "${KDDI_DTB[0]}")" = "$DTB_NAME" ] || { echo "::error::unexpected DTB ${KDDI_DTB[0]}"; exit 1; }
          [ "${#ALL_DTB[@]}" -eq 1 ] || { echo "::error::Image.gz-dtb would append ${#ALL_DTB[@]} DTBs, expected only poplar_kddi"; exit 1; }

          if [ ! -s "$B/Image.gz" ] || [ ! -s "$B/Image.gz-dtb" ]; then
            echo "::error::Image.gz / Image.gz-dtb missing"; exit 1
          fi
          gz="$(stat -c%s "$B/Image.gz")"; dtb="$(stat -c%s "${KDDI_DTB[0]}")"; tot="$(stat -c%s "$B/Image.gz-dtb")"
          [ "$tot" -eq $((gz + dtb)) ] || { echo "::error::Image.gz-dtb size $tot != Image.gz $gz + dtb $dtb"; exit 1; }
          head -c "$gz" "$B/Image.gz-dtb" | cmp - "$B/Image.gz" || { echo "::error::Image.gz-dtb does not start with Image.gz"; exit 1; }
          tail -c "$dtb" "$B/Image.gz-dtb" | cmp - "${KDDI_DTB[0]}" || { echo "::error::Image.gz-dtb does not end with the poplar_kddi DTB"; exit 1; }

          # Brand: kernel.release must end with the brand; the linked vmlinux must carry it too.
          KREL="$(cat out/include/config/kernel.release)"
          echo "kernel.release: $KREL"
          case "$KREL" in *"$BRAND") ;; *) echo "::error::kernel.release '$KREL' does not end with brand '$BRAND'"; exit 1 ;; esac
          case "$KREL" in *whatawurst*|*JustinLin099*) echo "::error::previous maintainer tag still present in kernel.release"; exit 1 ;; esac
          strings -n 8 out/vmlinux 2>/dev/null | grep -m1 'Linux version' > "$ART/linux_version.txt" || true
          [ -s "$ART/linux_version.txt" ] || { echo "::error::no 'Linux version' string found in vmlinux"; exit 1; }
          cat "$ART/linux_version.txt"
          grep -qF -- "$KREL" "$ART/linux_version.txt" || { echo "::error::vmlinux version string lacks '$KREL'"; exit 1; }
          grep -qF -- "#$KBUILD_BUILD_VERSION " "$ART/linux_version.txt" || { echo "::error::version string lacks '#$KBUILD_BUILD_VERSION'"; exit 1; }
          grep -qF -- "$KBUILD_BUILD_TIMESTAMP" "$ART/linux_version.txt" || { echo "::error::version string lacks timestamp '$KBUILD_BUILD_TIMESTAMP'"; exit 1; }

          # Toolchain actually used: compile.h records the compiler; every .cmd file records the tool the build invoked.
          CC_LINE="$(grep -m1 'LINUX_COMPILER' out/include/generated/compile.h 2>/dev/null || true)"
          if [ -z "$CC_LINE" ]; then
            echo "::warning::LINUX_COMPILER not found in out/include/generated/compile.h (compiler cannot be confirmed from it)"
          else
            echo "$CC_LINE" | tee "$ART/linux_compiler.txt"
            case "$CC_LINE" in *[Cc]lang*) ;; *) echo "::error::kernel was not built with clang: $CC_LINE"; exit 1 ;; esac
          fi
          {
            echo "tools invoked by the build (first word of each cmd_ line; host tools in scripts/ excluded; count tool):"
            find out -name '.*.cmd' -not -path 'out/scripts/*' -exec awk 'FNR==1 && $2==":=" {print $3}' {} + | sort | uniq -c | sort -rn | sed -n '1,25p'
          } | tee "$ART/tools-invoked.txt"

          # linked-in feature entry points
          if [ "$ENABLE_KSUN" = "true" ]; then
            for sym in ksu_handle_execveat ksu_handle_sys_reboot ksu_handle_faccessat ksu_handle_stat ksu_handle_sys_read is_ksu_transition; do
              grep -qE " [Tt] $sym\$" out/System.map || { echo "::error::KSU entry point $sym not linked"; exit 1; }
            done
            grep -qE ' [Tt] ksu_' out/System.map || { echo "::error::no ksu_* symbols linked into vmlinux"; exit 1; }
            grep -qE ' [Tt] path_umount$' out/System.map || { echo "::error::path_umount not linked"; exit 1; }
          fi
          if [ "$ENABLE_SUSFS" = "true" ]; then
            for sym in susfs_init susfs_run_sus_path_loop susfs_get_non_sus_mnt_id_from_mnt susfs_try_umount; do
              grep -qE " [Tt] $sym\$" out/System.map || { echo "::error::SUSFS symbol $sym not linked"; exit 1; }
            done
          fi
          if [ "$ENABLE_NOMOUNT" = "true" ]; then
            grep -qE ' [Tt] nomount_init$' out/System.map || { echo "::error::nomount_init not linked"; exit 1; }
            # v2.2.0 driver: the compat shims must have selected the 4.4 code paths (nm_follow_link replaces nm_get_link below 4.5).
            grep -qE ' [Tt] nm_follow_link$' out/System.map || echo "::warning::nm_follow_link not in System.map (inlined, or the 4.5+ get_link path was built?)"
          fi
          if [ "$ENABLE_BBG" = "true" ]; then
            grep -qE ' [Tt] bbg_init$' out/System.map || { echo "::error::bbg_init not linked"; exit 1; }
          fi
          {
            echo "kernel=whatawurst/android_kernel_sony_msm8998@$KERNEL_SHA"
            echo "ksun=$ENABLE_KSUN  susfs=$ENABLE_SUSFS  nomount=$ENABLE_NOMOUNT  bbg=$ENABLE_BBG  (rekernel: not part of this workflow)"
            if [ "$ENABLE_SUSFS" = "true" ]; then echo "susfs: $(grep -E '^#define SUSFS_VERSION' include/linux/susfs.h)  kernel-side=faryx@$FARYX_SHA  ksun_commit=$KSUN_SUSFS_SHA  ksun_diff_sha256=$(cat "$RUNNER_TEMP/ksun_susfs_diff.sha256")  scope: sus_mount+try_umount wired, other sub-options inert"; fi
            if [ "$ENABLE_KSUN" = "true" ]; then echo "ksun: $(git -C KernelSU-Next log -1 --format='%h %s' 2>/dev/null || echo n/a)  pin=$KSUN_SHA"; fi
            if [ "$ENABLE_BBG" = "true" ]; then echo "bbg: source=faryx@$FARYX_SHA"; fi
            if [ "$ENABLE_NOMOUNT" = "true" ]; then
              echo "nomount: $NOMOUNT_TAG ($(grep -E 'define NOMOUNT_BASE_VERSION' fs/nomount/nomount.h))  source=maxsteeel/nomount@$NOMOUNT_SHA + 4.4 compat patch  (needs the matching NoMount $NOMOUNT_TAG metamodule)"
            fi
            echo "toolchain: $TC_USED"
          } > "$ART/features.txt"
          cat "$ART/features.txt"

          cp "$B/Image.gz" "$B/Image.gz-dtb" "$ART/"
          cp "${KDDI_DTB[0]}" "$ART/"
          cp out/.config "$ART/resolved.config"
          if [ "$ENABLE_KSUN" = "true" ]; then git -C KernelSU-Next rev-parse HEAD > "$ART/ksun_commit.txt"; fi

      - name: Package AnyKernel3 ZIP (final product)
        shell: bash
        run: |
          set -Eeuo pipefail
          B="$KDIR/out/arch/arm64/boot"
          KREL="$(cat "$KDIR/out/include/config/kernel.release")"
          AKSRC="$RUNNER_TEMP/ak3-src"; STAGE="$RUNNER_TEMP/ak3-stage"
          rm -rf "$AKSRC" "$STAGE"; mkdir -p "$STAGE" "$DIST" "$AKSRC"

          git -C "$AKSRC" init -q
          git -C "$AKSRC" fetch -q --depth=1 "$AK3_REPO" "$IN_AK3_SHA"
          [ "$(git -C "$AKSRC" rev-parse FETCH_HEAD)" = "$IN_AK3_SHA" ] || { echo "::error::fetched AnyKernel3 commit is not $IN_AK3_SHA"; exit 1; }
          git -C "$AKSRC" checkout -q FETCH_HEAD
          echo "AnyKernel3 @ $IN_AK3_SHA" | tee "$ART/anykernel3-commit.txt"
          for f in META-INF tools modules patch ramdisk LICENSE; do
            [ -e "$AKSRC/$f" ] || { echo "::error::AnyKernel3 upstream lacks '$f'"; exit 1; }
            cp -a "$AKSRC/$f" "$STAGE/"
          done
          [ -f "$STAGE/tools/ak3-core.sh" ] || { echo "::error::tools/ak3-core.sh missing"; exit 1; }
          [ -f "$STAGE/META-INF/com/google/android/update-binary" ] || { echo "::error::update-binary missing"; exit 1; }

          # Kernel payload: DTB is already appended, so no separate dtb file is shipped.
          cp "$B/Image.gz-dtb" "$STAGE/Image.gz-dtb"

          KSU_LABEL="no root"
          if [ "$ENABLE_KSUN" = "true" ]; then KSU_LABEL="KernelSU-Next"; fi
          if [ "$ENABLE_SUSFS" = "true" ]; then KSU_LABEL="${KSU_LABEL} + SUSFS"; fi
          if [ "$ENABLE_NOMOUNT" = "true" ]; then KSU_LABEL="${KSU_LABEL} + NoMount ${NOMOUNT_TAG}"; fi
          if [ "$ENABLE_BBG" = "true" ]; then KSU_LABEL="${KSU_LABEL} + Baseband-guard"; fi
          # BLOCK=boot lets ak3-core.sh resolve the partition across /dev/block/by-name,
          # /dev/block/bootdevice/by-name and platform by-name paths (the last is what Sony devices expose).
          cat > "$STAGE/anykernel.sh" <<AK3SH
          ### AnyKernel3 script — Project Aegis ${RELEASE} (poplar_kddi / SOV36)
          properties() { '
          kernel.string=Project Aegis ${RELEASE} ${KREL} (${KSU_LABEL}) for poplar_kddi
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=poplar_kddi
          device.name2=SOV36
          device.name3=poplar
          device.name4=Sony KDDI SOV36
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties

          ### AnyKernel install
          BLOCK=boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          # import functions/variables and setup patching - see for reference (DO NOT REMOVE)
          . tools/ak3-core.sh;

          # boot install: kernel swap only, ramdisk is repacked untouched
          dump_boot;
          write_boot;
          AK3SH
          sh -n "$STAGE/anykernel.sh" || { echo "::error::generated anykernel.sh has a syntax error"; exit 1; }

          FEAT=""
          if [ "$ENABLE_KSUN" != "true" ]; then FEAT="${FEAT}-noksu"; fi
          if [ "$ENABLE_SUSFS" = "true" ]; then FEAT="${FEAT}-susfs"; fi
          if [ "$ENABLE_NOMOUNT" = "true" ]; then FEAT="${FEAT}-nomount${NOMOUNT_TAG}"; fi
          if [ "$ENABLE_BBG" = "true" ]; then FEAT="${FEAT}-bbg"; fi
          ZIPNAME="Aegis-${RELEASE}-poplar_kddi${BRAND}${FEAT}-AnyKernel3.zip"
          ZIP="$DIST/$ZIPNAME"
          rm -f "$ZIP"
          ( cd "$STAGE" && zip -r9 -X "$ZIP" . )

          # Verify the ZIP: integrity, required members, and byte-identity of the packed kernel.
          unzip -tq "$ZIP"
          LIST="$(unzip -Z1 "$ZIP")"
          for m in anykernel.sh Image.gz-dtb META-INF/com/google/android/update-binary \
                   META-INF/com/google/android/updater-script tools/ak3-core.sh; do
            printf '%s\n' "$LIST" | grep -qxF "$m" || { echo "::error::ZIP lacks $m"; exit 1; }
          done
          unzip -p "$ZIP" Image.gz-dtb | cmp - "$B/Image.gz-dtb" || { echo "::error::packed Image.gz-dtb differs from build output"; exit 1; }
          if printf '%s\n' "$LIST" | grep -qE '(^|/)(Image|dtb)$'; then echo "::error::stray Image/dtb in ZIP"; exit 1; fi

          ( cd "$DIST" && sha256sum "$ZIPNAME" ) | tee "$ART/zip.sha256"
          # Whole-artifact checksum manifest (kernel files + ZIP)
          ( cd "$ART" && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\n' | sort | xargs sha256sum > "$RUNNER_TEMP/SHA256SUMS" )
          mv "$RUNNER_TEMP/SHA256SUMS" "$ART/SHA256SUMS"
          cat "$ART/SHA256SUMS"
          {
            echo "ZIP_PATH=$ZIP"
            echo "ZIP_NAME=$ZIPNAME"
          } >> "$GITHUB_ENV"
          unzip -l "$ZIP"

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Project Aegis ${RELEASE} — poplar_kddi kernel build (whatawurst lineage-20 base)"
            echo "- kernel: \`whatawurst/android_kernel_sony_msm8998@${KERNEL_SHA:-$IN_KERNEL_SHA}\`  brand: \`${BRAND:-n/a}\`"
            echo "- build: \`#${KBUILD_BUILD_VERSION:-n/a}\`  \`${KBUILD_BUILD_TIMESTAMP:-n/a}\`"
            echo "- toolchain: \`${BUILD_TC:-${TC_USED:-n/a}}\` (pinned prebuilts commit \`${CLANG_PREBUILTS_SHA:0:12}\`, no fallback)"
            echo "- defconfig: \`$DEFCONFIG\`  dtb: \`$DTB_NAME\`"
            echo "- KernelSU-Next: \`$ENABLE_KSUN\` (\`${KSUN_SHA:0:12}\`, manual hooks)  NoMount: \`$ENABLE_NOMOUNT\` (\`$NOMOUNT_TAG\`)  SUSFS: \`$ENABLE_SUSFS\`  Baseband-guard: \`$ENABLE_BBG\`  Re:Kernel: not included"
            echo "- caveat: this workflow compiles, links and packages only. NOT boot-tested, NOT checked against Evolution X / Android 13, radio/baseband behaviour unverified."
            if [ "$ENABLE_KSUN" = "true" ]; then
              echo "- KernelSU-Next caveat: kernel-side hooks are the fork's subset (execve, faccessat, newfstatat, read, reboot, SELinux transition); no input-event, vfs_read, fstat-return or devpts hooks, so safe-mode key combo and some ksud features may be inert."
            fi
            if [ "$ENABLE_SUSFS" = "true" ]; then
              echo "- SUSFS caveat: kernel support only (userspace module/ksud must match). Only sus_mount and try_umount have kernel hook sites; sus_path, sus_kstat, open_redirect, spoof_uname, spoof_cmdline and sus_map are accepted but inert (same scope as Mk1r5). No concealment, Play Integrity or banking-app guarantee."
            fi
            if [ "$ENABLE_NOMOUNT" = "true" ]; then
              echo "- NoMount caveat: upstream \`$NOMOUNT_TAG\` (\`${NOMOUNT_SHA:0:8}\`, driver protocol v$NOMOUNT_PROTO) with a CI-applied 4.4 compat patch; needs the matching v2.2.0 metamodule."
            fi
            if [ "$ENABLE_BBG" = "true" ]; then
              echo "- Baseband-guard caveat: boot/recovery blocking are off, so flashing this zip from Android works."
            fi
            echo "- final product: \`${ZIP_NAME:-not produced}\` (AnyKernel3; structure-verified, not flash-tested here)"
            echo "- boot.img: not built (AnyKernel3 repacks the device's own boot image)"
            if [ -f "$ART/zip.sha256" ]; then echo '```'; cat "$ART/zip.sha256"; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Final product: ONE unzipped file (actions/upload-artifact@v7, archive: false).
      - name: Upload AnyKernel3 ZIP
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.ZIP_PATH }}
          archive: false
          if-no-files-found: error

      # Supporting files (build log, resolved config + delta, source delta, Image.gz, Image.gz-dtb, DTB, checksums) — kept on failure too.
      - name: Upload build artifacts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-mk2a13-poplar_kddi-run${{ github.run_number }}-build
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

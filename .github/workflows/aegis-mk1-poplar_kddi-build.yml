name: Project Aegis Mk1 — Build Kernel (Xperia XZ1 SOV36 poplar_kddi + KernelSU-Next) → AnyKernel3 ZIP

# ─────────────────────────────────────────────────────────────────────────────
# VERSION HISTORY
# v.20261028-r1 — Project Aegis Mk1. Derived from the poplar_kddi KSUN build workflow.
#   (1) Branding: CONFIG_LOCALVERSION is forced at CI time (LOCALVERSION_AUTO off), brand dropdown
#       "-Aegis_Mk1" | "-am1x[git7]" (default; '-am1x' + first 7 hex of the checked-out kernel HEAD) | Other.
#       KBUILD_BUILD_USER/HOST are set (defaults am1x / AegisDevLabs). The resolved .config, kernel.release
#       and the linked vmlinux are checked against the brand; any leftover "JustinLin099" fails the build.
#   (2) Toolchain choice: aosp (clang_rev, default r547379 = Clang 20; auto-falls back to r536225) | aosp19 |
#       neutron19 | weebx | zyc_stable. Only 'aosp' has an automatic fallback; explicit picks fail hard.
#   (3) Final product is an AnyKernel3 ZIP (Image.gz-dtb with the poplar_kddi DTB appended, KernelSU-Next
#       when enabled). It is structure-checked and the packed Image.gz-dtb is byte-compared with the build.
#       Packaging is compile/structure-verified only: NOT flash-tested on a device by this workflow.
# ─────────────────────────────────────────────────────────────────────────────
# Target : Sony Xperia XZ1 SOV36 (poplar_kddi), msm8998, Linux 4.4.302, arm64, non-GKI
# Config : arch/arm64/configs/lineage-msm8998-yoshino-poplar_kddi_defconfig (only this one)
# DTB    : arch/arm/boot/dts/qcom/msm8998-v2.1-yoshino-poplar_kddi.dtb (the only DTB built)
# Image  : CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y -> Image.gz-dtb = Image.gz + that one DTB (composed with cat)
# Root   : KernelSU-Next (submodule, legacy branch) in MANUAL hook mode. No SUSFS. No ReSukiSU.
# boot.img is intentionally NOT built (needs SOV36 ramdisk + header params + AVB inputs); AnyKernel3
# repacks the device's own boot image at flash time instead.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Kernel branch to build"
        required: true
        default: "lineage-22.2"
        type: string
      enable_ksun:
        description: "Build with KernelSU-Next (CONFIG_KSU=y, manual hooks). false = plain kernel"
        required: true
        default: true
        type: boolean
      toolchain:
        description: "aosp = AOSP clang (clang_rev, default r547379 = Clang 20, falls back to aosp19) | aosp19 = r536225 | neutron19 = Neutron clang-build-catalogue 10032024 | weebx = WeebX 20.0.0git | zyc_stable = ZyC (URL from Clang-main-link.txt). Only 'aosp' was in the previous workflow; the others are new here and not compile-tested by this file."
        required: true
        type: choice
        options: [aosp, aosp19, neutron19, weebx, zyc_stable]
        default: aosp
      clang_rev:
        description: "Only with toolchain=aosp: AOSP clang revision (e.g. r547379). Empty = r547379 (Clang 20)"
        required: false
        default: ""
        type: string
      brand:
        description: "LOCALVERSION suffix. '-am1x[git7]' = '-am1x' + first 7 hex of the kernel branch HEAD."
        required: true
        type: choice
        options:
          - "-Aegis_Mk1"
          - "-am1x[git7]"
          - "Other"
        default: "-am1x[git7]"
      custom_brand:
        description: "Custom brand — only if brand=Other (must start with '-')"
        required: false
        type: string
      build_user:
        description: "KBUILD_BUILD_USER"
        required: false
        default: "am1x"
        type: string
      build_host:
        description: "KBUILD_BUILD_HOST"
        required: false
        default: "AegisDevLabs"
        type: string
      ak3_ref:
        description: "AnyKernel3 upstream branch or tag (osm0sis/AnyKernel3). Resolved commit is logged. Default master is mutable."
        required: false
        default: "master"
        type: string

permissions:
  contents: read

concurrency:
  group: aegis-mk1-${{ inputs.branch }}-${{ inputs.toolchain }}
  cancel-in-progress: true

jobs:
  build:
    name: Aegis Mk1 poplar_kddi / ${{ inputs.toolchain }}
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      DEFCONFIG: lineage-msm8998-yoshino-poplar_kddi_defconfig
      DTB_NAME: msm8998-v2.1-yoshino-poplar_kddi.dtb
      KDIR: ${{ github.workspace }}/kernel
      ART: ${{ github.workspace }}/artifacts
      DIST: ${{ github.workspace }}/dist
      TC: ${{ github.workspace }}/toolchains
      BRANCH: ${{ inputs.branch }}
      ENABLE_KSUN: ${{ inputs.enable_ksun }}
      IN_TOOLCHAIN: ${{ inputs.toolchain }}
      CLANG_REV_INPUT: ${{ inputs.clang_rev }}
      IN_BRAND: ${{ inputs.brand }}
      IN_CUSTOM_BRAND: ${{ inputs.custom_brand }}
      IN_BUILD_USER: ${{ inputs.build_user }}
      IN_BUILD_HOST: ${{ inputs.build_host }}
      IN_AK3_REF: ${{ inputs.ak3_ref }}
      # AOSP prebuilts/clang: r547379 = Clang 20.0.0, r536225 = Clang 19 (known-good fallback)
      CLANG20_REV: r547379
      CLANG19_REV: r536225
      CLANG_REPO: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
      CLANG_REF: refs/heads/main
      NEUTRON19_URL: https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
      WEEBX_URL: https://github.com/XSans0/WeebX-Clang/releases/download/WeebX-Clang-20.0.0git-release/WeebX-Clang-20.0.0git.tar.gz
      WEEBX_SHA256: a2ac878d7f26fc1ac7d90d1330e4e34b62676d3a2326673b78b7799e1d8a0a7c
      ZYC_LINK_URL: https://raw.githubusercontent.com/ZyCromerZ/Clang/main/Clang-main-link.txt
      AK3_REPO: https://github.com/osm0sis/AnyKernel3.git
    steps:
      - name: Validate workflow inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IN_TOOLCHAIN" =~ ^(aosp|aosp19|neutron19|weebx|zyc_stable)$ ]] || { echo "::error::bad toolchain '$IN_TOOLCHAIN'"; exit 1; }
          if [ "$IN_TOOLCHAIN" = "aosp" ] && [ -n "$CLANG_REV_INPUT" ]; then
            [[ "$CLANG_REV_INPUT" =~ ^r[0-9]+[a-z]?$ ]] || { echo "::error::clang_rev must look like r547379 (got '$CLANG_REV_INPUT')"; exit 1; }
          fi
          [[ "$IN_BUILD_USER" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::bad build_user '$IN_BUILD_USER'"; exit 1; }
          [[ "$IN_BUILD_HOST" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::bad build_host '$IN_BUILD_HOST'"; exit 1; }
          [[ "$IN_AK3_REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::bad ak3_ref '$IN_AK3_REF'"; exit 1; }
          if [ "$IN_TOOLCHAIN" != "aosp" ] && [ -n "$CLANG_REV_INPUT" ]; then
            echo "::notice::clang_rev ignored (toolchain=$IN_TOOLCHAIN)"
          fi
          echo "inputs OK"

      - name: Checkout kernel (${{ inputs.branch }})
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 1
          submodules: false
          path: kernel

      - name: Resolve build identity (brand / user / host)
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git -C "$KDIR" rev-parse HEAD)"
          GIT7="${SHA:0:7}"
          case "$IN_BRAND" in
            "Other")        FINAL_BRAND="$IN_CUSTOM_BRAND" ;;
            "-am1x[git7]")  FINAL_BRAND="-am1x${GIT7}" ;;
            *)              FINAL_BRAND="$IN_BRAND" ;;
          esac
          [[ "$FINAL_BRAND" =~ ^-[A-Za-z0-9._+@:-]+$ ]] || { echo "::error::brand '$FINAL_BRAND' must start with '-' and use [A-Za-z0-9._+@:-]"; exit 1; }
          case "$FINAL_BRAND" in *JustinLin099*) echo "::error::brand must not contain JustinLin099"; exit 1 ;; esac
          {
            echo "BRAND=$FINAL_BRAND"
            echo "KERNEL_SHA=$SHA"
            echo "KBUILD_BUILD_USER=$IN_BUILD_USER"
            echo "KBUILD_BUILD_HOST=$IN_BUILD_HOST"
          } >> "$GITHUB_ENV"
          echo "brand=$FINAL_BRAND  kernel HEAD=$SHA  user=$IN_BUILD_USER  host=$IN_BUILD_HOST"

      - name: Init KernelSU-Next submodule (pinned gitlink)
        shell: bash
        run: |
          set -euo pipefail
          cd "$KDIR"
          mkdir -p "$ART" "$TC" "$DIST"
          grep -q 'KernelSU-Next' .gitmodules || { echo "::error::KernelSU-Next missing from .gitmodules"; exit 1; }
          # .gitmodules may still carry an SSH URL on old branches; force HTTPS on the runner.
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive
          # Full history + tags on purpose: KSUN Kbuild derives KSU_VERSION from `git rev-list --count`
          # and KSU_VERSION_TAG from `git describe`; a shallow clone yields a wrong version (30151) and an
          # empty tag, and Kbuild would try `git fetch --unshallow` in the middle of the build.
          git submodule update --init KernelSU-Next
          git -C KernelSU-Next fetch --tags --quiet || true
          echo "KSUN commits: $(git -C KernelSU-Next rev-list --count HEAD)  tag: $(git -C KernelSU-Next describe --tags --abbrev=0 2>/dev/null || echo none)"
          status="$(git submodule status KernelSU-Next)"
          echo "submodule: $status"
          case "$status" in
            [-+U]*) echo "::error::KernelSU-Next not at the pinned commit ($status)"; exit 1 ;;
          esac
          [ -L drivers/kernelsu ] || { echo "::error::drivers/kernelsu symlink missing"; exit 1; }
          [ -f drivers/kernelsu/Kconfig ] || { echo "::error::drivers/kernelsu/Kconfig unreachable through symlink"; exit 1; }

      - name: Preflight (target, KSUN hooks, no ReSukiSU)
        shell: bash
        run: |
          set -euo pipefail
          cd "$KDIR"
          D="arch/arm64/configs/$DEFCONFIG"
          [ -f "$D" ] || { echo "::error::$D not found"; exit 1; }
          echo "defconfig LOCALVERSION lines (overridden at CI time): $(grep -E '^(# )?CONFIG_LOCALVERSION' "$D" | tr '\n' ' ')"
          grep -q '^CONFIG_MACH_SONY_POPLAR_KDDI=y' "$D" || { echo "::error::$DEFCONFIG lacks CONFIG_MACH_SONY_POPLAR_KDDI=y"; exit 1; }
          if grep -qE '^CONFIG_MACH_SONY_(MAPLE|MAPLE_DSDS|POPLAR|POPLAR_DSDS|LILAC|LILAC_DCM)=y' "$D"; then
            echo "::error::$DEFCONFIG enables another Sony machine"; exit 1
          fi
          grep -qx 'CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE_NAMES="qcom/'"${DTB_NAME%.dtb}"'"' "$D" \
            || { echo "::error::defconfig must append only qcom/${DTB_NAME%.dtb}"; exit 1; }
          [ -f "arch/arm/boot/dts/qcom/${DTB_NAME%.dtb}.dts" ] || { echo "::error::DTS for $DTB_NAME not found"; exit 1; }
          # shellcheck disable=SC2016
          grep -q 'dtb-$(CONFIG_MACH_SONY_POPLAR_KDDI) += '"$DTB_NAME" arch/arm/boot/dts/qcom/Makefile \
            || { echo "::error::DTB rule for $DTB_NAME missing in qcom/Makefile"; exit 1; }

          # No ReSukiSU / SukiSU / SUSFS anywhere (kernel tree, submodule, docs). .github is excluded so
          # the workflow files themselves (which name these strings) are not flagged.
          if hits="$(grep -rIil -e resuki -e sukisu -e susfs --exclude-dir=.git --exclude-dir=.github . || true)"; [ -n "$hits" ]; then
            echo "::error::ReSukiSU/SukiSU/SUSFS references found:"; echo "$hits"; exit 1
          fi

          # GKI/kprobe-only symbols must not be set for this 4.4 kernel.
          if grep -qE '^CONFIG_KSU_(KPROBES_HOOK|TRACEPOINT_HOOK|SUSFS[A-Z_]*)=y' "$D"; then
            echo "::error::GKI-only/SUSFS KSU option enabled in $DEFCONFIG"; exit 1
          fi

          # Manual hooks must be in the tree (KSUN Kbuild refuses to build without kernel/reboot.c hook).
          for pair in "fs/exec.c:ksu_handle_execveat" "fs/open.c:ksu_handle_faccessat" "fs/stat.c:ksu_handle_stat" \
                      "fs/read_write.c:ksu_handle_sys_read" "kernel/reboot.c:ksu_handle_sys_reboot" \
                      "security/selinux/hooks.c:is_ksu_transition" "security/selinux/ss/services.c:is_ksu_transition"; do
            grep -q "${pair#*:}" "${pair%%:*}" || { echo "::error::manual hook ${pair#*:} missing in ${pair%%:*}"; exit 1; }
          done

          # KSUN Kbuild sed-patches kernel sources at parse time when these are absent. That races with
          # parallel compilation, so require them to be committed in the tree.
          chk() { grep -qF -- "$2" "$1" || { echo "::error::backport missing in $1: '$2' (Kbuild would patch it mid-build)"; exit 1; }; }
          chk fs/namespace.c 'static int can_umount'
          chk fs/namespace.c 'int path_umount'
          chk fs/internal.h  'int path_umount'
          chk include/linux/seccomp.h 'atomic_t filter_count;'
          chk security/selinux/hooks.c 'selinux_inode(inode)'
          chk security/selinux/hooks.c 'selinux_cred'
          chk security/selinux/selinuxfs.c 'selinux_inode(inode)'
          chk security/selinux/xfrm.c 'selinux_cred'
          chk security/selinux/include/objsec.h 'selinux_inode'
          chk security/selinux/include/objsec.h 'selinux_cred'
          echo "preflight OK"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          # arm-linux-gnueabi: CONFIG_COMPAT_VDSO=y needs the 32-bit GNU binutils (-no-integrated-as).
          # zstd: Neutron archives are .tar.zst.  zip/unzip: AnyKernel3 packaging + verification.
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev zlib1g-dev make gcc g++ perl python3 cpio kmod \
            xz-utils lz4 zstd zip unzip git curl ca-certificates \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

      - name: Write toolchain helper
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/tc-lib.sh" <<'LIB'
          # tc_fetch <id> <url> <fmt: tar.gz|tar.xz|tar.zst> [sha256]
          # Downloads, optionally SHA-verifies, extracts, smoke-tests clang.
          # On success sets TC_ID, TC_BIN_DIR, TC_VERSION and returns 0; any failure returns 1.
          tc_fetch() {
            local id="$1" url="$2" fmt="$3" want="${4:-}" archive dir code sha ver bindir
            archive="$TC/$id.archive"; dir="$TC/$id"
            echo "::group::toolchain $id"
            echo "download URL        : $url"
            code="$(curl -sS -L -o "$archive" -w '%{http_code}' --retry 3 --retry-delay 5 --connect-timeout 30 "$url" || true)"; code="${code:-000}"
            echo "download HTTP       : $code"
            if [ "$code" != "200" ] || [ ! -s "$archive" ]; then
              echo "::warning::download of $id failed (HTTP $code)"; echo "::endgroup::"; return 1
            fi
            sha="$(sha256sum "$archive" | cut -d' ' -f1)"
            echo "archive size        : $(stat -c%s "$archive")"
            echo "archive SHA256      : $sha"
            if [ -n "$want" ] && [ "$sha" != "$want" ]; then
              echo "::warning::SHA-256 mismatch for $id (expected $want)"; rm -f "$archive"; echo "::endgroup::"; return 1
            fi
            rm -rf "$dir"; mkdir -p "$dir"
            case "$fmt" in
              tar.gz)  tar -xzf "$archive" -C "$dir" ;;
              tar.xz)  tar -xJf "$archive" -C "$dir" ;;
              tar.zst) tar -I zstd -xf "$archive" -C "$dir" ;;
              *) echo "::warning::unsupported archive format '$fmt'"; echo "::endgroup::"; return 1 ;;
            esac || { echo "::warning::extract of $id failed"; echo "::endgroup::"; return 1; }
            rm -f "$archive"
            bindir="$(find "$dir" -name clang \( -type f -o -type l \) -path '*/bin/clang' -printf '%d\t%h\n' | sort -n | sed -n '1p' | cut -f2)"
            if [ -z "$bindir" ]; then
              echo "::warning::no bin/clang found in $id"; echo "::endgroup::"; return 1
            fi
            if ! ver="$("$bindir/clang" --version 2>&1)"; then
              echo "::warning::clang from $id does not execute"; echo "::endgroup::"; return 1
            fi
            ver="$(printf '%s\n' "$ver" | sed -n '1p')"
            echo "bin dir             : $bindir"
            echo "extracted version   : $ver"
            [ -x "$bindir/ld.lld" ] && echo "ld.lld              : present" || echo "::warning::ld.lld not found next to clang"
            {
              echo "id=$id"; echo "url=$url"; echo "http=$code"; echo "sha256=$sha"; echo "version=$ver"
            } > "$ART/toolchain-info-$id.txt"
            echo "::endgroup::"
            TC_ID="$id"; TC_BIN_DIR="$bindir"; TC_VERSION="$ver"
            return 0
          }

          # tc_aosp <rev>: verify the revision exists in prebuilts/clang, then tc_fetch it.
          tc_aosp() {
            local rev="$1" meta_url code
            meta_url="$CLANG_REPO/+/$CLANG_REF/clang-$rev/AndroidVersion.txt?format=TEXT"
            echo "::group::aosp clang $rev existence check"
            echo "existence check URL : $meta_url"
            code="$(curl -sS -L -o "$TC/AndroidVersion-$rev.b64" -w '%{http_code}' --retry 3 --retry-delay 5 "$meta_url" || true)"; code="${code:-000}"
            echo "existence check HTTP: $code"
            if [ "$code" != "200" ]; then
              echo "::warning::clang-$rev not found in $CLANG_REPO@$CLANG_REF (HTTP $code)"; echo "::endgroup::"; return 1
            fi
            echo "AndroidVersion.txt  : $(base64 -d "$TC/AndroidVersion-$rev.b64" 2>/dev/null | tr '\n' ' ')"
            echo "::endgroup::"
            tc_fetch "aosp-$rev" "$CLANG_REPO/+archive/$CLANG_REF/clang-$rev.tar.gz" tar.gz ""
          }

          # tc_acquire <toolchain-name>
          tc_acquire() {
            local url fmt
            case "$1" in
              aosp)       tc_aosp "${CLANG_REV_INPUT:-$CLANG20_REV}" ;;
              aosp19)     tc_aosp "$CLANG19_REV" ;;
              neutron19)  tc_fetch neutron19 "$NEUTRON19_URL" tar.zst "" ;;
              weebx)      tc_fetch weebx "$WEEBX_URL" tar.gz "$WEEBX_SHA256" ;;
              zyc_stable)
                url="$(curl -fsSL --retry 3 "$ZYC_LINK_URL" | sed -n '1p' | tr -d '\r' || true)"
                case "$url" in
                  https://*.tar.gz|https://*.tgz) fmt=tar.gz ;;
                  https://*.tar.xz)               fmt=tar.xz ;;
                  https://*.tar.zst)              fmt=tar.zst ;;
                  *) echo "::warning::zyc_stable: cannot derive URL/format from link file (got '$url')"; return 1 ;;
                esac
                tc_fetch "zyc_stable" "$url" "$fmt" "" ;;
              *) echo "::warning::unknown toolchain '$1'"; return 1 ;;
            esac
          }
          LIB
          bash -n "$RUNNER_TEMP/tc-lib.sh"

      - name: Acquire toolchain
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/tc-lib.sh"
          TC_ID=""; TC_BIN_DIR=""; TC_VERSION=""
          used=""
          if tc_acquire "$IN_TOOLCHAIN"; then
            used="$TC_ID"
          elif [ "$IN_TOOLCHAIN" = "aosp" ]; then
            echo "::warning::primary AOSP clang unavailable; falling back to aosp-$CLANG19_REV"
            if tc_acquire aosp19; then used="$TC_ID"; fi
          fi
          [ -n "$used" ] || { echo "::error::no usable toolchain (requested '$IN_TOOLCHAIN')"; exit 1; }
          {
            echo "TC_USED=$used"
            echo "TC_PRIMARY=$IN_TOOLCHAIN"
          } >> "$GITHUB_ENV"
          echo "$TC_BIN_DIR" >> "$GITHUB_PATH"
          echo "using toolchain $used: $TC_VERSION"

      - name: Configure (defconfig, brand, non-interactive) and verify
        shell: bash
        run: |
          set -euo pipefail
          cd "$KDIR"
          cat > "$RUNNER_TEMP/make-args.sh" <<'EOF'
          MAKE_ARGS=(O=out ARCH=arm64 SUBARCH=arm64
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            CC=clang LLVM=1 CLANG_TRIPLE=aarch64-linux-gnu-
            HOSTCC="gcc -fcommon" HOSTCXX=g++)
          EOF
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/make-args.sh"
          rm -rf out

          make "${MAKE_ARGS[@]}" "$DEFCONFIG" </dev/null
          if [ "$ENABLE_KSUN" != "true" ]; then
            ./scripts/config --file out/.config -d KSU
          fi
          # Branding: force LOCALVERSION and drop the git-derived auto suffix so the release string is
          # exactly <kernelversion><BRAND>.
          ./scripts/config --file out/.config --set-str LOCALVERSION "$BRAND" -d LOCALVERSION_AUTO
          make "${MAKE_ARGS[@]}" olddefconfig </dev/null

          # Resolution must be stable and prompt-free: a second pass changes nothing,
          # and silentoldconfig (run by the real build) must not need input.
          cp out/.config "$RUNNER_TEMP/config.pass1"
          make "${MAKE_ARGS[@]}" olddefconfig </dev/null
          cmp -s out/.config "$RUNNER_TEMP/config.pass1" || { echo "::error::config not stable across olddefconfig passes"; diff "$RUNNER_TEMP/config.pass1" out/.config | head -40; exit 1; }
          make "${MAKE_ARGS[@]}" silentoldconfig </dev/null

          if EMPTY="$(grep -nE '^CONFIG_[A-Za-z0-9_]+=$' out/.config)"; [ -n "$EMPTY" ]; then
            echo "::error::empty config values (would prompt): $(echo "$EMPTY" | tr '\n' ' ')"; exit 1
          fi
          must() { grep -qxF -- "$1" out/.config || { echo "::error::missing in resolved .config: $1"; exit 1; }; }
          mustnot() { if grep -qxE -- "$1" out/.config; then echo "::error::unexpected in resolved .config: $1"; exit 1; fi; }
          must CONFIG_MACH_SONY_POPLAR_KDDI=y
          must CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y
          must 'CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE_NAMES="qcom/msm8998-v2.1-yoshino-poplar_kddi"'
          must CONFIG_LITTLE_CPU_MASK=15
          must CONFIG_BIG_CPU_MASK=240
          must "CONFIG_LOCALVERSION=\"$BRAND\""
          mustnot 'CONFIG_LOCALVERSION_AUTO=y'
          mustnot '.*JustinLin099.*'
          mustnot 'CONFIG_MACH_SONY_(MAPLE|MAPLE_DSDS|POPLAR|POPLAR_DSDS|LILAC|LILAC_DCM)=y'
          mustnot 'CONFIG_KSU_(KPROBES_HOOK|TRACEPOINT_HOOK|SUSFS[A-Z_]*)=y'
          if [ "$ENABLE_KSUN" = "true" ]; then
            must CONFIG_KSU=y
            must CONFIG_KSU_MANUAL_HOOK=y
          else
            mustnot 'CONFIG_KSU=[ym]'
          fi
          grep -E '^(# )?CONFIG_(KSU|MACH_SONY_|BUILD_ARM64_APPENDED|LOCALVERSION)' out/.config

      - name: Build poplar_kddi DTB and Image.gz-dtb (poplar_kddi DTB only)
        shell: bash
        run: |
          set -uo pipefail
          cd "$KDIR"
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/make-args.sh"
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/tc-lib.sh"
          : > "$ART/build.log"

          build() {
            local jobs; jobs="$(nproc)"
            {
              echo "=== clang: $(clang --version | head -1)"
              # flask.h is generated under security/selinux and included by drivers/kernelsu;
              # generate it first so parallel descent cannot race.
              make -j"$jobs" "${MAKE_ARGS[@]}" security/selinux/ &&
              make -j"$jobs" "${MAKE_ARGS[@]}" "qcom/$DTB_NAME" &&
              make -j"$jobs" "${MAKE_ARGS[@]}" Image.gz &&
              cat out/arch/arm64/boot/Image.gz "out/arch/arm64/boot/dts/qcom/$DTB_NAME" > out/arch/arm64/boot/Image.gz-dtb
            } 2>&1 | tee -a "$ART/build.log"
            return "${PIPESTATUS[0]}"
          }

          if build; then
            echo "BUILD_TC=$TC_USED" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "::warning::build failed with toolchain $TC_USED"
          # Automatic fallback exists only for the 'aosp' selection (AOSP r547379 -> r536225).
          if [ "$TC_PRIMARY" != "aosp" ] || [ "$TC_USED" = "aosp-$CLANG19_REV" ]; then
            echo "::error::build failed with toolchain $TC_USED (no automatic fallback for this selection)"; exit 1
          fi
          echo "::warning::retrying clean build with fallback aosp-$CLANG19_REV"
          TC_ID=""; TC_BIN_DIR=""; TC_VERSION=""
          tc_acquire aosp19 || { echo "::error::fallback clang unavailable"; exit 1; }
          export PATH="$TC_BIN_DIR:$PATH"
          cp out/.config "$RUNNER_TEMP/config.keep"
          rm -rf out && mkdir -p out && cp "$RUNNER_TEMP/config.keep" out/.config
          make "${MAKE_ARGS[@]}" olddefconfig </dev/null
          echo "=== RETRY WITH FALLBACK CLANG $CLANG19_REV ===" >> "$ART/build.log"
          build || { echo "::error::build failed with fallback clang $CLANG19_REV"; exit 1; }
          echo "TC_USED=$TC_ID" >> "$GITHUB_ENV"
          echo "BUILD_TC=$TC_ID" >> "$GITHUB_ENV"

      - name: Verify outputs, brand and collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd "$KDIR"
          B=out/arch/arm64/boot

          mapfile -t ALL_DTB < <(find -L "$B/dts" -name '*.dtb' | sort)
          mapfile -t KDDI_DTB < <(find -L "$B/dts" -name '*poplar_kddi*.dtb' | sort)
          echo "all dtbs     : ${ALL_DTB[*]:-none}"
          echo "poplar_kddi  : ${KDDI_DTB[*]:-none}"
          [ "${#KDDI_DTB[@]}" -eq 1 ] || { echo "::error::expected exactly 1 poplar_kddi DTB, found ${#KDDI_DTB[@]}"; exit 1; }
          [ "$(basename "${KDDI_DTB[0]}")" = "$DTB_NAME" ] || { echo "::error::unexpected DTB ${KDDI_DTB[0]}"; exit 1; }
          [ "${#ALL_DTB[@]}" -eq 1 ] || { echo "::error::Image.gz-dtb would append ${#ALL_DTB[@]} DTBs, expected only poplar_kddi"; exit 1; }

          if [ ! -s "$B/Image.gz" ] || [ ! -s "$B/Image.gz-dtb" ]; then
            echo "::error::Image.gz / Image.gz-dtb missing"; exit 1
          fi
          gz="$(stat -c%s "$B/Image.gz")"; dtb="$(stat -c%s "${KDDI_DTB[0]}")"; tot="$(stat -c%s "$B/Image.gz-dtb")"
          [ "$tot" -eq $((gz + dtb)) ] || { echo "::error::Image.gz-dtb size $tot != Image.gz $gz + dtb $dtb"; exit 1; }
          head -c "$gz" "$B/Image.gz-dtb" | cmp - "$B/Image.gz" || { echo "::error::Image.gz-dtb does not start with Image.gz"; exit 1; }
          tail -c "$dtb" "$B/Image.gz-dtb" | cmp - "${KDDI_DTB[0]}" || { echo "::error::Image.gz-dtb does not end with the poplar_kddi DTB"; exit 1; }

          # Brand: kernel.release must end with the brand; the linked vmlinux must carry it too.
          KREL="$(cat out/include/config/kernel.release)"
          echo "kernel.release: $KREL"
          case "$KREL" in *"$BRAND") ;; *) echo "::error::kernel.release '$KREL' does not end with brand '$BRAND'"; exit 1 ;; esac
          case "$KREL" in *JustinLin099*) echo "::error::JustinLin099 still present in kernel.release"; exit 1 ;; esac
          strings -n 8 out/vmlinux 2>/dev/null | grep -m1 'Linux version' > "$ART/linux_version.txt" || true
          [ -s "$ART/linux_version.txt" ] || { echo "::error::no 'Linux version' string found in vmlinux"; exit 1; }
          cat "$ART/linux_version.txt"
          grep -qF -- "$KREL" "$ART/linux_version.txt" || { echo "::error::vmlinux version string lacks '$KREL'"; exit 1; }
          if grep -q 'JustinLin099' "$ART/linux_version.txt"; then echo "::error::JustinLin099 in vmlinux version string"; exit 1; fi

          if [ "$ENABLE_KSUN" = "true" ]; then
            grep -qE ' [Tt] ksu_' out/System.map || { echo "::error::no ksu_* symbols linked into vmlinux"; exit 1; }
            grep -qE ' [Tt] ksu_handle_(execveat|sys_reboot|faccessat|stat)' out/System.map \
              || { echo "::error::manual hook entry points not linked"; exit 1; }
          fi

          cp "$B/Image.gz" "$B/Image.gz-dtb" "$ART/"
          cp "${KDDI_DTB[0]}" "$ART/"
          cp out/.config "$ART/resolved.config"
          git -C "$KDIR" submodule status KernelSU-Next > "$ART/ksun_submodule.txt" || true
          echo "$KERNEL_SHA" > "$ART/kernel_head_sha.txt"

      - name: Package AnyKernel3 ZIP (final product)
        shell: bash
        run: |
          set -Eeuo pipefail
          B="$KDIR/out/arch/arm64/boot"
          KREL="$(cat "$KDIR/out/include/config/kernel.release")"
          AKSRC="$RUNNER_TEMP/ak3-src"; STAGE="$RUNNER_TEMP/ak3-stage"
          rm -rf "$AKSRC" "$STAGE"; mkdir -p "$STAGE" "$DIST"

          git clone --depth=1 --branch "$IN_AK3_REF" "$AK3_REPO" "$AKSRC"
          echo "AnyKernel3 $IN_AK3_REF @ $(git -C "$AKSRC" rev-parse HEAD)" | tee "$ART/anykernel3-commit.txt"
          for f in META-INF tools modules patch ramdisk LICENSE; do
            [ -e "$AKSRC/$f" ] || { echo "::error::AnyKernel3 upstream lacks '$f'"; exit 1; }
            cp -a "$AKSRC/$f" "$STAGE/"
          done
          [ -f "$STAGE/tools/ak3-core.sh" ] || { echo "::error::tools/ak3-core.sh missing"; exit 1; }
          [ -f "$STAGE/META-INF/com/google/android/update-binary" ] || { echo "::error::update-binary missing"; exit 1; }

          # Kernel payload: DTB is already appended, so no separate dtb file is shipped.
          cp "$B/Image.gz-dtb" "$STAGE/Image.gz-dtb"

          if [ "$ENABLE_KSUN" = "true" ]; then KSU_LABEL="KernelSU-Next"; else KSU_LABEL="no root"; fi
          # BLOCK=boot lets ak3-core.sh resolve the partition across /dev/block/by-name,
          # /dev/block/bootdevice/by-name and platform by-name paths (the last is what Sony devices expose).
          cat > "$STAGE/anykernel.sh" <<AK3SH
          ### AnyKernel3 script — Project Aegis Mk1 (poplar_kddi / SOV36)
          properties() { '
          kernel.string=Project Aegis Mk1 ${KREL} (${KSU_LABEL}) for poplar_kddi
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=poplar_kddi
          device.name2=SOV36
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties

          ### AnyKernel install
          BLOCK=boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          # import functions/variables and setup patching - see for reference (DO NOT REMOVE)
          . tools/ak3-core.sh;

          # boot install: kernel swap only, ramdisk is repacked untouched
          dump_boot;
          write_boot;
          AK3SH
          sh -n "$STAGE/anykernel.sh" || { echo "::error::generated anykernel.sh has a syntax error"; exit 1; }

          ZIPNAME="Aegis-Mk1-poplar_kddi${BRAND}-AnyKernel3.zip"
          [ "$ENABLE_KSUN" = "true" ] || ZIPNAME="Aegis-Mk1-poplar_kddi${BRAND}-noksu-AnyKernel3.zip"
          ZIP="$DIST/$ZIPNAME"
          rm -f "$ZIP"
          ( cd "$STAGE" && zip -r9 -X "$ZIP" . )

          # Verify the ZIP: integrity, required members, and byte-identity of the packed kernel.
          unzip -tq "$ZIP"
          LIST="$(unzip -Z1 "$ZIP")"
          for m in anykernel.sh Image.gz-dtb META-INF/com/google/android/update-binary \
                   META-INF/com/google/android/updater-script tools/ak3-core.sh; do
            printf '%s\n' "$LIST" | grep -qxF "$m" || { echo "::error::ZIP lacks $m"; exit 1; }
          done
          unzip -p "$ZIP" Image.gz-dtb | cmp - "$B/Image.gz-dtb" || { echo "::error::packed Image.gz-dtb differs from build output"; exit 1; }
          if printf '%s\n' "$LIST" | grep -qE '(^|/)(Image|dtb)$'; then echo "::error::stray Image/dtb in ZIP"; exit 1; fi

          ( cd "$DIST" && sha256sum "$ZIPNAME" ) | tee "$ART/zip.sha256"
          # Whole-artifact checksum manifest (kernel files + ZIP)
          ( cd "$ART" && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\n' | sort | xargs sha256sum > "$RUNNER_TEMP/SHA256SUMS" )
          mv "$RUNNER_TEMP/SHA256SUMS" "$ART/SHA256SUMS"
          cat "$ART/SHA256SUMS"
          {
            echo "ZIP_PATH=$ZIP"
            echo "ZIP_NAME=$ZIPNAME"
          } >> "$GITHUB_ENV"
          unzip -l "$ZIP"

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Project Aegis Mk1 — poplar_kddi kernel build"
            echo "- branch: \`$BRANCH\`  brand: \`${BRAND:-n/a}\`  KSUN: \`$ENABLE_KSUN\`"
            echo "- toolchain: \`${BUILD_TC:-${TC_USED:-n/a}}\` (requested \`${TC_PRIMARY:-$IN_TOOLCHAIN}\`)"
            echo "- defconfig: \`$DEFCONFIG\`  dtb: \`$DTB_NAME\`"
            echo "- final product: \`${ZIP_NAME:-not produced}\` (AnyKernel3; structure-verified, not flash-tested here)"
            echo "- boot.img: not built (AnyKernel3 repacks the device's own boot image)"
            if [ -f "$ART/zip.sha256" ]; then echo '```'; cat "$ART/zip.sha256"; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Final product: ONE unzipped file (actions/upload-artifact@v7, archive: false).
      - name: Upload AnyKernel3 ZIP
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.ZIP_PATH }}
          archive: false
          if-no-files-found: error

      # Supporting files (build log, resolved config, Image.gz, Image.gz-dtb, DTB, checksums) as one bundle.
      - name: Upload build artifacts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-mk1-poplar_kddi-run${{ github.run_number }}-build
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
